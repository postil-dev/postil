name: Postil Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  merge_group:

concurrency:
  group: postil-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-output-contract:
    name: Validate Postil output contract
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    env:
      POSTIL_CLI_REF: d0c81b91b6082c7788b2dec78eaf5f5bacc348c2
      POSTIL_CLI_REPO: postil-dev/postil-cli
      POSTIL_CLI_AUTHOR: morgaesis
      POSTIL_CLI_COMMITTER: web-flow
    steps:
      - name: Validate pinned CLI ref
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$POSTIL_CLI_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::postil-cli ref must be a full 40-character commit SHA."
            exit 1
          fi
          if [[ ! "$POSTIL_CLI_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::postil-cli repository must be an owner/repo slug."
            exit 1
          fi

          headers=(-H "Accept: application/vnd.github+json")
          if [[ -n "${GITHUB_TOKEN:-}" ]]; then
            headers+=(-H "Authorization: Bearer $GITHUB_TOKEN")
          fi

          verification_url="https://api.github.com/repos/${POSTIL_CLI_REPO}/commits/${POSTIL_CLI_REF}"
          verification="$(curl -fsSL "${headers[@]}" "$verification_url")"
          if [[ "$(jq -r '.sha' <<<"$verification")" != "$POSTIL_CLI_REF" ]]; then
            echo "::error::postil-cli ref did not resolve to the expected commit."
            exit 1
          fi
          if [[ "$(jq -r '.commit.verification.verified' <<<"$verification")" != "true" ]]; then
            reason="$(jq -r '.commit.verification.reason' <<<"$verification")"
            echo "::error::postil-cli commit is not verified ($reason)."
            exit 1
          fi
          if [[ "$(jq -r '.commit.verification.reason' <<<"$verification")" != "valid" ]]; then
            echo "::error::postil-cli commit verification is not valid."
            exit 1
          fi
          if [[ "$(jq -r '.author.login // empty' <<<"$verification")" != "$POSTIL_CLI_AUTHOR" ]]; then
            echo "::error::postil-cli commit author is not trusted."
            exit 1
          fi
          if [[ "$(jq -r '.committer.login // empty' <<<"$verification")" != "$POSTIL_CLI_COMMITTER" ]]; then
            echo "::error::postil-cli commit committer is not trusted."
            exit 1
          fi

          checkout_dir="$RUNNER_TEMP/postil-cli-src"
          rm -rf "$checkout_dir"
          git init -q "$checkout_dir"
          git -C "$checkout_dir" remote add origin "https://github.com/${POSTIL_CLI_REPO}.git"
          git -C "$checkout_dir" fetch --depth=1 origin "$POSTIL_CLI_REF"
          if [[ "$(git -C "$checkout_dir" rev-parse FETCH_HEAD)" != "$POSTIL_CLI_REF" ]]; then
            echo "::error::postil-cli commit mismatch after fetch."
            exit 1
          fi
          git -C "$checkout_dir" checkout --force --detach FETCH_HEAD

      - name: Set up Rust
        run: |
          set -euo pipefail
          if command -v cargo >/dev/null 2>&1; then
            exit 0
          fi
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs |
            sh -s -- --profile minimal --default-toolchain stable -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Postil CLI
        run: cargo install --path "$RUNNER_TEMP/postil-cli-src" --locked --force

      - name: Assert output contract
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          cat > "$workdir/mock_openrouter.py" <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()

              def do_POST(self):
                  length = int(self.headers.get("content-length", "0"))
                  payload = json.loads(self.rfile.read(length) or b"{}")
                  messages = payload.get("messages", [])
                  user_content = messages[-1].get("content", "") if messages else ""
                  if "finding-risk" in user_content:
                      content = {
                          "summary": "Unsafe deletion can remove unrelated rows.",
                          "findings": [
                              {
                                  "path": "src/db.ts",
                                  "line": 1,
                                  "severity": "warn",
                                  "kind": "risk",
                                  "body": "Deleting records without tenant scoping can remove unrelated rows. Add a tenant filter before merge."
                              }
                          ]
                      }
                  else:
                      content = {"summary": "", "findings": []}
                  response = {
                      "choices": [
                          {
                              "message": {"content": json.dumps(content)},
                              "finish_reason": "stop"
                          }
                      ],
                      "usage": {
                          "prompt_tokens": 1,
                          "completion_tokens": 1,
                          "total_tokens": 2
                      }
                  }
                  body = json.dumps(response).encode("utf-8")
                  self.send_response(200)
                  self.send_header("content-type", "application/json")
                  self.send_header("content-length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *_args):
                  return

          HTTPServer(("127.0.0.1", 18765), Handler).serve_forever()
          PY

          python3 "$workdir/mock_openrouter.py" &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$workdir"' EXIT
          for _ in {1..30}; do
            if curl -fsS "http://127.0.0.1:18765" >/dev/null; then
              break
            fi
            sleep 0.2
          done

          cat > "$workdir/clean.diff" <<'DIFF'
          diff --git a/src/math.ts b/src/math.ts
          index 1111111..2222222 100644
          --- a/src/math.ts
          +++ b/src/math.ts
          @@ -1 +1 @@
          -export const value = 1;
          +export const value = 2;
          DIFF

          postil review \
            --diff-file "$workdir/clean.diff" \
            --output-json "$workdir/clean.json" \
            --openrouter-api-key test \
            --openrouter-api-url "http://127.0.0.1:18765" \
            --review-model mock-model \
            --fail-on error

          jq -e '.summary == "" and (.findings | length) == 0' "$workdir/clean.json"

          cat > "$workdir/finding.diff" <<'DIFF'
          diff --git a/src/db.ts b/src/db.ts
          index 1111111..2222222 100644
          --- a/src/db.ts
          +++ b/src/db.ts
          @@ -1 +1 @@
          -await db.delete("sessions").where({ tenantId });
          +await db.delete("sessions"); // finding-risk
          DIFF

          postil review \
            --diff-file "$workdir/finding.diff" \
            --output-json "$workdir/finding.json" \
            --openrouter-api-key test \
            --openrouter-api-url "http://127.0.0.1:18765" \
            --review-model mock-model \
            --fail-on error

          jq -e '
            .summary != ""
            and (.findings | length) == 1
            and .findings[0].path == "src/db.ts"
            and .findings[0].line == 1
            and .findings[0].severity == "warn"
            and (.findings[0].body | test("clean|no findings|looks good|safe"; "i") | not)
          ' "$workdir/finding.json"

          status="$(
            jq -r '[.findings[].severity] | map(if . == "error" then "❌" elif . == "warn" then "⚠️" else "ℹ️" end) | join("")' "$workdir/finding.json"
          )"
          test "$status" = "⚠️"

  review:
    name: Postil Review
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
    steps:
      - name: Skip review in merge queue (already ran on PR)
        if: github.event_name == 'merge_group'
        run: echo "Postil Review was enforced at PR time; merge-queue re-run is not required."

      - name: Checkout base ref (never PR head)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Verify reviewer commit
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          verification="$(
            curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/postil-dev/postil-reviewer/commits/f25e97bbe473d2df957453bf5439904839a2959c
          )"
          if [[ "$(jq -r '.commit.verification.verified' <<<"$verification")" != "true" ]]; then
            echo "::error::reviewer commit is not verified"
            exit 1
          fi

      - name: Install Postil reviewer
        if: github.event_name == 'pull_request_target'
        run: cargo install --git https://github.com/postil-dev/postil-reviewer --rev f25e97bbe473d2df957453bf5439904839a2959c --locked --force

      - name: Fetch review secrets
        id: fetch-secrets
        if: github.event_name == 'pull_request_target'
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          domain: https://eu.infisical.com
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /postil
          export-type: env

      - name: Complete review check after secret fetch failure
        if: github.event_name == 'pull_request_target' && failure() && steps.fetch-secrets.outcome == 'failure'
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          node <<'JS'
          const fs = require("node:fs");

          async function main() {
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            const pull = event.pull_request;
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
            const headSha = pull && pull.head && pull.head.sha;

            if (!owner || !repo || !headSha) {
              return;
            }

            if (!process.env.GITHUB_PAT) {
              throw new Error("GITHUB_PAT is required to complete the review check");
            }

            const headers = {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${process.env.GITHUB_PAT}`,
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
            };

            const runsResponse = await fetch(
              `https://api.github.com/repos/${owner}/${repo}/commits/${headSha}/check-runs`,
              { headers },
            );

            if (!runsResponse.ok) {
              throw new Error(`check-run lookup failed: ${runsResponse.status}`);
            }

            const runsPayload = await runsResponse.json();
            const checkRuns = (runsPayload.check_runs || []).filter(
              (run) => run && run.name === "postil/review" && run.status !== "completed",
            );

            if (checkRuns.length === 0) {
              throw new Error("open postil/review check run not found");
            }

            for (const checkRun of checkRuns) {
              const response = await fetch(
                `https://api.github.com/repos/${owner}/${repo}/check-runs/${checkRun.id}`,
                {
                  method: "PATCH",
                  headers,
                  body: JSON.stringify({
                    status: "completed",
                    conclusion: "failure",
                    completed_at: new Date().toISOString(),
                    output: {
                      title: "Postil Review",
                      summary: "Review setup failed before execution could start.",
                      text: "Review setup failed before execution could start.",
                    },
                  }),
                },
              );

              if (!response.ok) {
                throw new Error(`check-run completion failed: ${response.status}`);
              }
            }
          }

          main().catch((err) => {
            console.error(err instanceof Error ? err.message : String(err));
            process.exit(1);
          });
          JS

      - name: Set up Bun
        if: github.event_name == 'pull_request_target'
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        if: github.event_name == 'pull_request_target'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run postil review
        if: github.event_name == 'pull_request_target'
        run: bun run postil review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
