name: Postil Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: postil-review-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    name: Postil Review
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
    timeout-minutes: 15
    steps:
      - name: Skip review in merge queue (already ran on PR)
        if: github.event_name == 'merge_group'
        run: echo "Postil Review was enforced at PR time; merge-queue re-run is not required."

      - name: Checkout base ref (never PR head)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Run postil review
        if: github.event_name == 'pull_request_target'
        uses: postil-dev/postil-action@main
        with:
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
