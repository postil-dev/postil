name: Postil Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  merge_group:

concurrency:
  group: postil-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-output-contract:
    name: Validate Postil output contract
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    env:
      POSTIL_CLI_REF: d0c81b91b6082c7788b2dec78eaf5f5bacc348c2
      POSTIL_CLI_REPO: postil-dev/postil-cli
      POSTIL_CLI_AUTHOR: morgaesis
      POSTIL_CLI_COMMITTER: web-flow
    steps:
      - name: Validate pinned CLI ref
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$POSTIL_CLI_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::postil-cli ref must be a full 40-character commit SHA."
            exit 1
          fi
          if [[ ! "$POSTIL_CLI_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::postil-cli repository must be an owner/repo slug."
            exit 1
          fi

          headers=(-H "Accept: application/vnd.github+json")
          if [[ -n "${GITHUB_TOKEN:-}" ]]; then
            headers+=(-H "Authorization: Bearer $GITHUB_TOKEN")
          fi

          verification_url="https://api.github.com/repos/${POSTIL_CLI_REPO}/commits/${POSTIL_CLI_REF}"
          verification="$(curl -fsSL "${headers[@]}" "$verification_url")"
          if [[ "$(jq -r '.sha' <<<"$verification")" != "$POSTIL_CLI_REF" ]]; then
            echo "::error::postil-cli ref did not resolve to the expected commit."
            exit 1
          fi
          if [[ "$(jq -r '.commit.verification.verified' <<<"$verification")" != "true" ]]; then
            reason="$(jq -r '.commit.verification.reason' <<<"$verification")"
            echo "::error::postil-cli commit is not verified ($reason)."
            exit 1
          fi
          if [[ "$(jq -r '.commit.verification.reason' <<<"$verification")" != "valid" ]]; then
            echo "::error::postil-cli commit verification is not valid."
            exit 1
          fi
          if [[ "$(jq -r '.author.login // empty' <<<"$verification")" != "$POSTIL_CLI_AUTHOR" ]]; then
            echo "::error::postil-cli commit author is not trusted."
            exit 1
          fi
          if [[ "$(jq -r '.committer.login // empty' <<<"$verification")" != "$POSTIL_CLI_COMMITTER" ]]; then
            echo "::error::postil-cli commit committer is not trusted."
            exit 1
          fi

          checkout_dir="$RUNNER_TEMP/postil-cli-src"
          rm -rf "$checkout_dir"
          git init -q "$checkout_dir"
          git -C "$checkout_dir" remote add origin "https://github.com/${POSTIL_CLI_REPO}.git"
          git -C "$checkout_dir" fetch --depth=1 origin "$POSTIL_CLI_REF"
          if [[ "$(git -C "$checkout_dir" rev-parse FETCH_HEAD)" != "$POSTIL_CLI_REF" ]]; then
            echo "::error::postil-cli commit mismatch after fetch."
            exit 1
          fi
          git -C "$checkout_dir" checkout --force --detach FETCH_HEAD

      - name: Set up Rust
        run: |
          set -euo pipefail
          if command -v cargo >/dev/null 2>&1; then
            exit 0
          fi
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs |
            sh -s -- --profile minimal --default-toolchain stable -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Postil CLI
        run: cargo install --path "$RUNNER_TEMP/postil-cli-src" --locked --force

      - name: Assert output contract
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          cat > "$workdir/mock_openrouter.py" <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()

              def do_POST(self):
                  length = int(self.headers.get("content-length", "0"))
                  payload = json.loads(self.rfile.read(length) or b"{}")
                  messages = payload.get("messages", [])
                  user_content = messages[-1].get("content", "") if messages else ""
                  if "finding-risk" in user_content:
                      content = {
                          "summary": "Unsafe deletion can remove unrelated rows.",
                          "findings": [
                              {
                                  "path": "src/db.ts",
                                  "line": 1,
                                  "severity": "warn",
                                  "kind": "risk",
                                  "body": "Deleting records without tenant scoping can remove unrelated rows. Add a tenant filter before merge."
                              }
                          ]
                      }
                  else:
                      content = {"summary": "", "findings": []}
                  response = {
                      "choices": [
                          {
                              "message": {"content": json.dumps(content)},
                              "finish_reason": "stop"
                          }
                      ],
                      "usage": {
                          "prompt_tokens": 1,
                          "completion_tokens": 1,
                          "total_tokens": 2
                      }
                  }
                  body = json.dumps(response).encode("utf-8")
                  self.send_response(200)
                  self.send_header("content-type", "application/json")
                  self.send_header("content-length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *_args):
                  return

          HTTPServer(("127.0.0.1", 18765), Handler).serve_forever()
          PY

          python3 "$workdir/mock_openrouter.py" &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$workdir"' EXIT
          for _ in {1..30}; do
            if curl -fsS "http://127.0.0.1:18765" >/dev/null; then
              break
            fi
            sleep 0.2
          done

          cat > "$workdir/clean.diff" <<'DIFF'
          diff --git a/src/math.ts b/src/math.ts
          index 1111111..2222222 100644
          --- a/src/math.ts
          +++ b/src/math.ts
          @@ -1 +1 @@
          -export const value = 1;
          +export const value = 2;
          DIFF

          postil review \
            --diff-file "$workdir/clean.diff" \
            --output-json "$workdir/clean.json" \
            --openrouter-api-key test \
            --openrouter-api-url "http://127.0.0.1:18765" \
            --review-model mock-model \
            --fail-on error

          jq -e '.summary == "" and (.findings | length) == 0' "$workdir/clean.json"

          cat > "$workdir/finding.diff" <<'DIFF'
          diff --git a/src/db.ts b/src/db.ts
          index 1111111..2222222 100644
          --- a/src/db.ts
          +++ b/src/db.ts
          @@ -1 +1 @@
          -await db.delete("sessions").where({ tenantId });
          +await db.delete("sessions"); // finding-risk
          DIFF

          postil review \
            --diff-file "$workdir/finding.diff" \
            --output-json "$workdir/finding.json" \
            --openrouter-api-key test \
            --openrouter-api-url "http://127.0.0.1:18765" \
            --review-model mock-model \
            --fail-on error

          jq -e '
            .summary != ""
            and (.findings | length) == 1
            and .findings[0].path == "src/db.ts"
            and .findings[0].line == 1
            and .findings[0].severity == "warn"
            and (.findings[0].body | test("clean|no findings|looks good|safe"; "i") | not)
          ' "$workdir/finding.json"

          status="$(
            jq -r '[.findings[].severity] | map(if . == "error" then "❌" elif . == "warn" then "⚠️" else "ℹ️" end) | join("")' "$workdir/finding.json"
          )"
          test "$status" = "⚠️"

  review:
    name: Postil Review
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      POSTIL_CLI_REF: d0c81b91b6082c7788b2dec78eaf5f5bacc348c2
      POSTIL_CLI_REPO: postil-dev/postil-cli
      POSTIL_CLI_AUTHOR: morgaesis
      POSTIL_CLI_COMMITTER: web-flow
    steps:
      - name: Skip review in merge queue (already ran on PR)
        if: github.event_name == 'merge_group'
        run: echo "Postil Review was enforced at PR time; merge-queue re-run is not required."

      - name: Checkout base ref (never PR head)
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail

          checkout_dir="$GITHUB_WORKSPACE"
          if [[ "${ACT:-}" == "true" ]]; then
            checkout_dir="$RUNNER_TEMP/postil-base-checkout"
            rm -rf "$checkout_dir"
            mkdir -p "$checkout_dir"
          fi

          git config --global --add safe.directory "$checkout_dir"
          if ! git -C "$checkout_dir" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$checkout_dir" init
          fi
          if git -C "$checkout_dir" remote get-url origin >/dev/null 2>&1; then
            git -C "$checkout_dir" remote set-url origin "https://github.com/${{ github.repository }}.git"
          else
            git -C "$checkout_dir" remote add origin "https://github.com/${{ github.repository }}.git"
          fi

          if [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            if ! git -C "$checkout_dir" fetch --depth=1 origin "$BASE_SHA"; then
              if [[ "${ACT:-}" != "true" ]]; then
                exit 1
              fi
              echo "::warning::could not fetch act event base SHA; checking out the default branch for local workflow validation."
              git -C "$checkout_dir" fetch --depth=1 origin "$DEFAULT_BRANCH"
            fi
          elif [[ "${ACT:-}" == "true" ]]; then
            echo "::warning::act event base ref is not a full SHA; checking out the default branch for local workflow validation."
            git -C "$checkout_dir" fetch --depth=1 origin "$DEFAULT_BRANCH"
          else
            echo "::error::pull request base ref must be a full 40-character commit SHA."
            exit 1
          fi

          git -C "$checkout_dir" checkout --force FETCH_HEAD
          git -C "$checkout_dir" rev-parse HEAD

      - name: Verify and checkout Postil CLI
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! "$POSTIL_CLI_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::postil-cli ref must be a full 40-character commit SHA."
            exit 1
          fi
          if [[ ! "$POSTIL_CLI_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::postil-cli repository must be an owner/repo slug."
            exit 1
          fi

          headers=(-H "Accept: application/vnd.github+json")
          if [[ -n "${GITHUB_TOKEN:-}" ]]; then
            headers+=(-H "Authorization: Bearer $GITHUB_TOKEN")
          fi

          verification_url="https://api.github.com/repos/${POSTIL_CLI_REPO}/commits/${POSTIL_CLI_REF}"
          verification="$(curl -fsSL "${headers[@]}" "$verification_url")"
          if [[ "$(jq -r '.sha' <<<"$verification")" != "$POSTIL_CLI_REF" ]]; then
            echo "::error::postil-cli ref did not resolve to the expected commit."
            exit 1
          fi
          if [[ "$(jq -r '.commit.verification.verified' <<<"$verification")" != "true" ]]; then
            reason="$(jq -r '.commit.verification.reason' <<<"$verification")"
            echo "::error::postil-cli commit is not verified ($reason)."
            exit 1
          fi
          if [[ "$(jq -r '.commit.verification.reason' <<<"$verification")" != "valid" ]]; then
            echo "::error::postil-cli commit verification is not valid."
            exit 1
          fi
          if [[ "$(jq -r '.author.login // empty' <<<"$verification")" != "$POSTIL_CLI_AUTHOR" ]]; then
            echo "::error::postil-cli commit author is not trusted."
            exit 1
          fi
          if [[ "$(jq -r '.committer.login // empty' <<<"$verification")" != "$POSTIL_CLI_COMMITTER" ]]; then
            echo "::error::postil-cli commit committer is not trusted."
            exit 1
          fi

          checkout_dir="$RUNNER_TEMP/postil-cli-src"
          rm -rf "$checkout_dir"
          git init -q "$checkout_dir"
          git -C "$checkout_dir" remote add origin "https://github.com/${POSTIL_CLI_REPO}.git"
          git -C "$checkout_dir" fetch --depth=1 origin "$POSTIL_CLI_REF"
          if [[ "$(git -C "$checkout_dir" rev-parse FETCH_HEAD)" != "$POSTIL_CLI_REF" ]]; then
            echo "::error::postil-cli commit mismatch after fetch."
            exit 1
          fi
          git -C "$checkout_dir" checkout --force --detach FETCH_HEAD

      - name: Set up Rust
        if: github.event_name == 'pull_request_target'
        run: |
          set -euo pipefail
          if command -v cargo >/dev/null 2>&1; then
            exit 0
          fi
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs |
            sh -s -- --profile minimal --default-toolchain stable -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Postil CLI
        if: github.event_name == 'pull_request_target'
        run: cargo install --path "$RUNNER_TEMP/postil-cli-src" --locked --force

      - name: Review pull request
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_MODEL: deepseek/deepseek-v4-pro
        run: |
          set -euo pipefail

          pr_number="${{ github.event.pull_request.number }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          review_repo="${{ github.repository }}"
          if [[ ! "$review_repo" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::repository must be an owner/repo slug."
            exit 1
          fi
          if [[ ! "$REVIEW_MODEL" =~ ^[A-Za-z0-9._:/-]+$ ]]; then
            echo "::error::review model contains invalid characters."
            exit 1
          fi
          if [[ "${ACT:-}" == "true" ]]; then
            pr_number="${ACT_PULL_REQUEST_NUMBER:-$pr_number}"
            head_sha="${ACT_PULL_REQUEST_SHA:-$head_sha}"
          fi
          if [[ -z "$pr_number" || -z "$head_sha" ]]; then
            echo "::error::pull request number and head SHA are required; set ACT_PULL_REQUEST_NUMBER and ACT_PULL_REQUEST_SHA when running under act."
            exit 1
          fi

          postil review \
            --repo "$review_repo" \
            --pr "$pr_number" \
            --sha "$head_sha" \
            --github-api-url https://api.github.com \
            --openrouter-api-url https://openrouter.ai/api/v1 \
            --fail-on error
