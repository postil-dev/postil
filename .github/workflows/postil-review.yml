name: Postil Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: postil-review-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    name: Postil Review
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
    timeout-minutes: 15
    env:
      POSTIL_REVIEWER_REV: 3df78f88531aadb76942f4c69bc5a22e4421be34
    steps:
      - name: Skip review in merge queue (already ran on PR)
        if: github.event_name == 'merge_group'
        run: echo "Postil Review was enforced at PR time; merge-queue re-run is not required."

      - name: Checkout base ref (never PR head)
        if: github.event_name == 'pull_request_target'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          git checkout --force FETCH_HEAD

      - name: Set up Rust
        if: github.event_name == 'pull_request_target'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Verify reviewer commit
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewer_rev="$POSTIL_REVIEWER_REV"
          test -n "$reviewer_rev"
          verification="$(
            curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/postil-dev/postil-reviewer/commits/$reviewer_rev"
          )"
          if [[ "$(jq -r '.commit.verification.verified' <<<"$verification")" != "true" ]]; then
            echo "::error::reviewer commit is not verified"
            exit 1
          fi

      - name: Install Rust for act
        if: env.ACT == 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Postil reviewer
        if: github.event_name == 'pull_request_target'
        run: |
          reviewer_rev="$POSTIL_REVIEWER_REV"
          test -n "$reviewer_rev"
          cargo install --git https://github.com/postil-dev/postil-reviewer --rev "$reviewer_rev" --locked --force

      - name: Set up Bun
        if: github.event_name == 'pull_request_target'
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        if: github.event_name == 'pull_request_target'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run postil review
        if: github.event_name == 'pull_request_target'
        run: bun run postil review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
