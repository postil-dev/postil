name: Postil Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: postil-review-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  id-token: write

jobs:
  review:
    name: Postil Review
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
    timeout-minutes: 15
    steps:
      - name: Skip review in merge queue (already ran on PR)
        if: github.event_name == 'merge_group'
        run: echo "Postil Review was enforced at PR time; merge-queue re-run is not required."

      - name: Checkout base ref (never PR head)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Fetch secrets from Infisical
        id: fetch-secrets
        if: github.event_name == 'pull_request_target'
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          domain: https://eu.infisical.com
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /postil
          export-type: env

      - name: Complete review check after secret fetch failure
        if: github.event_name == 'pull_request_target' && failure() && steps.fetch-secrets.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          node <<'JS'
          const fs = require("node:fs");

          async function main() {
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            const pull = event.pull_request;
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
            const headSha = pull && pull.head && pull.head.sha;

            if (!owner || !repo || !headSha) {
              return;
            }

            const headers = {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
            };

            const runsResponse = await fetch(
              `https://api.github.com/repos/${owner}/${repo}/commits/${headSha}/check-runs`,
              { headers },
            );

            if (!runsResponse.ok) {
              throw new Error(`check-run lookup failed: ${runsResponse.status}`);
            }

            const runsPayload = await runsResponse.json();
            const checkRun = (runsPayload.check_runs || [])
              .filter((run) => run && run.name === "postil/review" && run.status !== "completed")
              .sort((left, right) => {
                const leftTime = Date.parse(left.started_at || left.created_at || "1970-01-01T00:00:00Z");
                const rightTime = Date.parse(right.started_at || right.created_at || "1970-01-01T00:00:00Z");
                return rightTime - leftTime;
              })[0];

            if (!checkRun) {
              throw new Error("open postil/review check run not found");
            }

            const response = await fetch(
              `https://api.github.com/repos/${owner}/${repo}/check-runs/${checkRun.id}`,
              {
                method: "PATCH",
                headers,
                body: JSON.stringify({
                  status: "completed",
                  conclusion: "failure",
                  completed_at: new Date().toISOString(),
                  output: {
                    title: "Postil Review",
                    summary: "Review setup failed before execution could start.",
                    text: "Review setup failed before execution could start.",
                  },
                }),
              },
            );

            if (!response.ok) {
              throw new Error(`check-run completion failed: ${response.status}`);
            }
          }

          main().catch((err) => {
            console.error(err instanceof Error ? err.message : String(err));
            process.exit(1);
          });
          JS

      - name: Set up Bun
        if: github.event_name == 'pull_request_target'
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        if: github.event_name == 'pull_request_target'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run postil review
        if: github.event_name == 'pull_request_target'
        run: bun run postil review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
