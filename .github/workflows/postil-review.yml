name: Postil Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  merge_group:

concurrency:
  group: postil-review-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-action-path:
    name: Validate Postil action path
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 5
    env:
      POSTIL_ACTION_REF: 1bb169edc7f513d673267c4a0554eba98a7c8304
      POSTIL_CLI_REF: d0c81b91b6082c7788b2dec78eaf5f5bacc348c2
    steps:
      - name: Validate pinned refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          check_ref() {
            local repo="$1"
            local ref="$2"
            local require_verified="$3"

            if [[ ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::$repo ref must be a full 40-character commit SHA."
              exit 1
            fi

            headers=(-H "Accept: application/vnd.github+json")
            if [[ -n "${GITHUB_TOKEN:-}" ]]; then
              headers+=(-H "Authorization: Bearer $GITHUB_TOKEN")
            fi

            verification="$(curl -fsSL "${headers[@]}" "https://api.github.com/repos/postil-dev/$repo/commits/$ref")"
            if [[ "$(jq -r '.sha' <<<"$verification")" != "$ref" ]]; then
              echo "::error::$repo ref did not resolve to the expected commit."
              exit 1
            fi
            if [[ "$require_verified" == "true" && "$(jq -r '.commit.verification.verified' <<<"$verification")" != "true" ]]; then
              reason="$(jq -r '.commit.verification.reason' <<<"$verification")"
              echo "::error::$repo commit is not verified ($reason)."
              exit 1
            fi
          }

          check_ref postil-action "$POSTIL_ACTION_REF" false
          check_ref postil-cli "$POSTIL_CLI_REF" true

  review:
    name: Postil Review
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      POSTIL_ACTION_REF: 1bb169edc7f513d673267c4a0554eba98a7c8304
      POSTIL_CLI_REF: d0c81b91b6082c7788b2dec78eaf5f5bacc348c2
    steps:
      - name: Skip review in merge queue (already ran on PR)
        if: github.event_name == 'merge_group'
        run: echo "Postil Review was enforced at PR time; merge-queue re-run is not required."

      - name: Checkout base ref (never PR head)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Verify review credentials
        if: github.event_name == 'pull_request_target'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error title=Missing review model credentials::Set OPENROUTER_API_KEY as a repository or organization secret for this workflow."
            exit 1
          fi

      - name: Verify Postil action inputs
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          check_ref() {
            local repo="$1"
            local ref="$2"
            local require_verified="$3"

            if [[ ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::$repo ref must be a full 40-character commit SHA."
              exit 1
            fi

            headers=(-H "Accept: application/vnd.github+json")
            if [[ -n "${GITHUB_TOKEN:-}" ]]; then
              headers+=(-H "Authorization: Bearer $GITHUB_TOKEN")
            fi

            verification="$(curl -fsSL "${headers[@]}" "https://api.github.com/repos/postil-dev/$repo/commits/$ref")"
            if [[ "$(jq -r '.sha' <<<"$verification")" != "$ref" ]]; then
              echo "::error::$repo ref did not resolve to the expected commit."
              exit 1
            fi
            if [[ "$require_verified" == "true" && "$(jq -r '.commit.verification.verified' <<<"$verification")" != "true" ]]; then
              reason="$(jq -r '.commit.verification.reason' <<<"$verification")"
              echo "::error::$repo commit is not verified ($reason)."
              exit 1
            fi
          }

          check_ref postil-action "$POSTIL_ACTION_REF" false
          check_ref postil-cli "$POSTIL_CLI_REF" true

      - name: Run postil review
        if: github.event_name == 'pull_request_target'
        uses: postil-dev/postil-action@1bb169edc7f513d673267c4a0554eba98a7c8304
        with:
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cli-ref: d0c81b91b6082c7788b2dec78eaf5f5bacc348c2
