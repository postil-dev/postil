name: Design Review Workflow

on:
  pull_request:
    paths:
      - 'brand/**'
      - 'src/app/**/page.tsx'
      - 'src/app/**/layout.tsx'
      - 'src/components/**'
      - 'src/app/globals.css'
      - 'tailwind.config.*'
      - '*.md'

jobs:
  design_review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        
      - name: Install playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: |
          npx playwright test --update-snapshots || true
        env:
          NODE_ENV: test
          
      - name: Run Designer Agent Review
        # Using placeholder action/script for the postil-design agent call
        # The designer agent logic/call should be implemented here or an existing action
        run: |
          echo "Calling designer AI roaster model here..."
          # Pseudo-code for designer agent invocation
          # npx postil-cli review --designer --diff ".patch" --screenshots "test-results"
