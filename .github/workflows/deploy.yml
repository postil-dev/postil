name: deploy

on:
  # Deploy only after the ci workflow has completed successfully on main,
  # not merely on push: ci and deploy used to run in parallel off the same
  # push event, so a merge commit that failed post-merge CI could still
  # deploy while its own test run was still in flight or had failed.
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    # Skips quietly until the FLY_DEPLOY_ENABLED repo variable is set to
    # 'true' (and the FLY_API_TOKEN secret is configured). Also skips a
    # workflow_run event whose ci run did not succeed; workflow_dispatch
    # (manual deploy) has no associated ci run and always proceeds.
    if: vars.FLY_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Bake the pinned CLI into the image so the worker can spawn it.
      # `src/data/public-cli-release.json` is the only place the pinned release
      # is named. This step always runs on deploy so
      # vendor/postil is always populated with a cosign-verified binary
      # before the image is built. The Dockerfile has no fetch fallback of
      # its own and fails the build if vendor/postil is absent, so this step
      # is what actually authenticates the CLI binary that ships in the
      # image.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify deploy source types
        run: |
          set -euo pipefail
          [[ "${TARGET_RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${TARGET_RELEASE_SHA}"
          bun install --frozen-lockfile
          bunx tsc --noEmit
      - name: Fetch pinned postil CLI
        # Four assets are fetched serially. Each curl can spend
        # (1 initial attempt + 5 retries) * 60s max-time + 5 * 2s retry-delay
        # = 370s, so 4 * 370s = 1480s worst case before verification/install.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          TAG="$(node -e 'process.stdout.write(require("./src/data/public-cli-release.json").hostedCliRelease)')"
          expected_commit="$(node -e 'process.stdout.write(require("./src/data/public-cli-release.json").hostedCliCommit)')"
          expected_sha256="$(node -e 'process.stdout.write(require("./src/data/public-cli-release.json").hostedCliLinuxX86_64Sha256)')"
          if [[ -z "${TAG}" ]]; then
            echo "::error::public-cli-release.json must name a compatible postil-cli release in hostedCliRelease."
            exit 1
          fi
          if [[ ! "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::hostedCliRelease ${TAG} must be a stable vMAJOR.MINOR.PATCH release."
            exit 1
          fi
          echo "POSTIL_CLI_TAG=${TAG}" >> "$GITHUB_ENV"
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          if (( major == 0 && minor < 5 )); then
            echo "::error::hostedCliRelease ${TAG} is incompatible; v0.5.0 or newer is required."
            exit 1
          fi
          if grep -q '^POSTIL_PROVISIONAL_HOSTED_ROSTER = "1"$' fly.toml \
            && (( major == 0 && minor < 7 )); then
            echo "::error::The provisional hosted roster requires postil-cli v0.7.0 or newer. Update hostedCliRelease in public-cli-release.json to the exact published release."
            exit 1
          fi
          base="https://github.com/postil-dev/postil-cli/releases/download/${TAG}"
          art="postil-x86_64-unknown-linux-gnu.tar.gz"
          tmp=""
          cleanup() {
            if [[ -n "${tmp}" && -d "${tmp}" ]]; then
              rm -rf "${tmp}"
            fi
            rm -f vendor/postil.tmp
          }
          trap cleanup EXIT INT TERM
          if ! tmp="$(mktemp -d)" || [[ -z "${tmp}" || ! -d "${tmp}" ]]; then
            echo "::error::Failed to create temporary directory for postil CLI download."
            exit 1
          fi

          fetch_asset() {
            local name="$1"
            curl --fail --show-error --silent --location \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 10 \
              --max-time 60 \
              --output "${tmp}/${name}" \
              "${base}/${name}"
          }

          fetch_asset "${art}"
          fetch_asset "${art}.sha256"
          fetch_asset "${art}.sig"
          fetch_asset "${art}.pem"
          published_sha256="$(awk 'NR == 1 { print $1 }' "${tmp}/${art}.sha256")"
          if [[ ! "${published_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Published checksum for ${art} is malformed."
            exit 1
          fi
          if [[ "${published_sha256}" != "${expected_sha256}" ]]; then
            echo "::error::Published checksum for ${art} differs from the repository release authority."
            exit 1
          fi
          (cd "$tmp" && sha256sum -c "${art}.sha256")
          # Checksum guards transit corruption only; the Sigstore signature is
          # tied to postil-cli's own release.yml workflow identity via keyless
          # OIDC and is what actually proves this artifact came from there.
          cosign verify-blob "${tmp}/${art}" \
            --signature "${tmp}/${art}.sig" \
            --certificate "${tmp}/${art}.pem" \
            --certificate-identity "https://github.com/postil-dev/postil-cli/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-github-workflow-sha "${expected_commit}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          mkdir -p vendor
          rm -f vendor/postil.tmp
          tar -xzf "${tmp}/${art}" -C "$tmp" postil
          if [[ ! -x "${tmp}/postil" ]]; then
            echo "::error::Extracted postil binary is missing or not executable."
            exit 1
          fi
          install -m 0755 "${tmp}/postil" vendor/postil.tmp
          mv -f vendor/postil.tmp vendor/postil
          bun run scripts/verify-postil-cli-contract.ts --binary vendor/postil
      - name: Install checksum-pinned flyctl
        env:
          FLYCTL_VERSION: 0.4.71
          FLYCTL_LINUX_X86_64_SHA256: a782dceed173d215c000ab94e2b08623c22267edff6d90ebe3010b3f9b671dc2
        run: |
          set -euo pipefail
          archive="flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          url="https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/${archive}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --output "${tmp}/${archive}" "${url}"
          printf '%s  %s\n' "${FLYCTL_LINUX_X86_64_SHA256}" "${tmp}/${archive}" \
            | sha256sum --check --strict
          tar -xzf "${tmp}/${archive}" -C "${tmp}" flyctl
          install -m 0755 "${tmp}/flyctl" "${RUNNER_TEMP}/flyctl"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/flyctl" version
      - name: Verify compatible source fleet
        id: source-fleet
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [[ ! "${TARGET_RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The target release must be an exact lowercase commit SHA."
            exit 1
          fi
          umask 077
          machines=$(flyctl machine list --app postil-web --json)
          jq '[.[] | select(
            .config.metadata.fly_process_group == "web" or
            .config.metadata.fly_process_group == "worker" or
            .config.metadata.fly_process_group == "monitor"
          )]' <<<"${machines}" > "${RUNNER_TEMP}/postil-source-machines.json"
          machines=$(cat "${RUNNER_TEMP}/postil-source-machines.json")
          if ! jq -e 'length >= 4 and all(.[];
            .state == "started" and .host_status == "ok" and
            all(.checks[]?; .status == "passing")
          )' <<<"${machines}" >/dev/null; then
            echo "::error::Every source machine must be started on a healthy host with passing checks."
            exit 1
          fi
          if ! fleet_summary=$(jq -ce -f scripts/verify-managed-fleet.jq <<<"${machines}"); then
            echo "::error::The source fleet is not healthy and homogeneous."
            exit 1
          fi
          source_image=$(jq -er '
            [.[] | select(
              .config.metadata.fly_platform_version == "v2" and
              (.config.metadata.fly_process_group == "web" or
               .config.metadata.fly_process_group == "worker" or
               .config.metadata.fly_process_group == "monitor")
            ) | (.image_ref.registry + "/" + .image_ref.repository + "@" + .image_ref.digest)] | unique |
            if length == 1 then .[0] else error("source image is not unique") end
          ' <<<"${machines}")
          if [[ ! "${source_image}" =~ ^registry\.fly\.io/postil-web@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The source fleet image reference is invalid."
            exit 1
          fi
          mapfile -t machine_ids < <(jq -r '.[] | select(
            .config.metadata.fly_platform_version == "v2" and
            (.config.metadata.fly_process_group == "web" or
             .config.metadata.fly_process_group == "worker" or
             .config.metadata.fly_process_group == "monitor")
          ) | .id' <<<"${machines}")
          managed_count=$(jq -r '.managed_count' <<<"${fleet_summary}")
          if [[ "${#machine_ids[@]}" -ne "${managed_count}" ]]; then
            echo "::error::Source fleet evidence is incomplete."
            exit 1
          fi
          source_release=""
          for id in "${machine_ids[@]}"; do
            if [[ ! "${id}" =~ ^[0-9a-f]+$ ]]; then
              echo "::error::A managed machine identifier is invalid."
              exit 1
            fi
            if ! release=$(flyctl machine exec "${id}" \
              "bun -e 'const release = process.env.POSTIL_RELEASE_SHA ?? \"\"; if (!/^[0-9a-f]{40}$/.test(release)) process.exit(64); process.stdout.write(release)'" \
              --app postil-web --timeout 15 2>/dev/null); then
              echo "::error::A managed machine did not report an exact release SHA."
              exit 1
            fi
            if [[ -z "${source_release}" ]]; then
              source_release="${release}"
            elif [[ "${release}" != "${source_release}" ]]; then
              echo "::error::The managed source fleet reports mixed releases."
              exit 1
            fi
          done
          if [[ ! "${source_release}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The managed source release is invalid."
            exit 1
          fi
          echo "release-sha=${source_release}" >> "${GITHUB_OUTPUT}"
          echo "image=${source_image}" >> "${GITHUB_OUTPUT}"
          echo "Compatible source fleet verified."
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify runtime secret contract
        id: secret-contract
        timeout-minutes: 2
        run: |
          set -euo pipefail
          umask 077
          fly_secrets=$(flyctl secrets list --app postil-web --json)
          if ! jq -e '
            [.[] | .name] as $names |
            all(.[];
              (.name | type == "string" and length > 0) and
              (.digest | type == "string" and length > 0) and .status == "Deployed") and
            ($names | index("DATABASE_URL") != null) and
            all($names[];
              test("^(POSTIL_RELEASE_SHA|POSTIL_COMPATIBLE_SOURCE_RELEASE_SHA|POSTIL_RELEASE_PROTOCOL|POSTIL_MANAGED_RELEASE|POSTIL_HOSTED_INFERENCE_ENABLED|POSTIL_PROVISIONAL_HOSTED_ROSTER|REVIEW_MODEL|REVIEW_MODEL_CASCADE)$") | not)
          ' <<<"${fly_secrets}" >/dev/null; then
            echo "::error::Runtime secrets do not satisfy the managed release contract; separate configuration maintenance is required."
            exit 1
          fi
          jq -cS 'map({name, digest, status}) | sort_by(.name)' <<<"${fly_secrets}" > "${RUNNER_TEMP}/postil-source-secrets.json"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Provision private monitor state volume
        id: monitor-volume
        timeout-minutes: 5
        run: |
          set -euo pipefail
          volumes=$(flyctl volumes list --app postil-web --json)
          count=$(jq -r '[.[] | select((.name // .Name) == "postil_monitor_state" and (.region // .Region) == "lhr")] | length' <<<"${volumes}")
          if [ "${count}" -eq 0 ]; then
            if ! flyctl volumes create postil_monitor_state --app postil-web --region lhr --size 1 --yes >/dev/null 2>&1; then
              echo "::error::Private monitor state volume provisioning failed."
              exit 1
            fi
            volumes=$(flyctl volumes list --app postil-web --json)
          elif [ "${count}" -ne 1 ]; then
            echo "::error::Expected exactly one private monitor state volume in lhr."
            exit 1
          fi
          volume_id=$(jq -er '[.[] | select((.name // .Name) == "postil_monitor_state" and (.region // .Region) == "lhr")] | if length == 1 then (.[0].id // .[0].ID) else error("private monitor volume is not unique") end' <<<"${volumes}")
          echo "volume-id=${volume_id}" >> "${GITHUB_OUTPUT}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy managed fleet
        id: deploy
        timeout-minutes: 10
        run: |
          set -euo pipefail
          fly_secrets=$(flyctl secrets list --app postil-web --json)
          if ! jq -e --slurpfile source "${RUNNER_TEMP}/postil-source-secrets.json" '
            (map({name, digest, status}) | sort_by(.name)) == $source[0]
          ' <<<"${fly_secrets}" >/dev/null; then
            echo "::error::Fly secret metadata changed after source capture; deployment requires separate configuration maintenance."
            exit 1
          fi
          flyctl deploy \
            --remote-only \
            --strategy rolling \
            --build-arg POSTIL_CLI_REV="${POSTIL_CLI_TAG}" \
            --build-arg POSTIL_RELEASE_SHA="${TARGET_RELEASE_SHA}" \
            --build-arg POSTIL_COMPATIBLE_SOURCE_RELEASE_SHA="${SOURCE_RELEASE_SHA}" \
            --build-arg POSTIL_RELEASE_PROTOCOL=additive-publication-hosted-v1 \
            --build-arg POSTIL_MANAGED_RELEASE=1 \
            --build-arg POSTIL_DEPLOY_SOURCE_TYPECHECKED=1 \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST="${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          SOURCE_RELEASE_SHA: ${{ steps.source-fleet.outputs.release-sha }}
      - name: Verify managed fleet after rolling replacement
        id: verify
        # Existing reviews remain available throughout the rollout. This check
        # verifies the deployed fleet and durable monitor state without changing
        # release capabilities or retiring stored data.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          machines=$(flyctl machine list --app postil-web --json)
          if ! jq -ce -f scripts/verify-managed-fleet.jq <<<"${machines}" >/dev/null; then
            echo "::error::Release verification failed: fleet image, process, or hosted-inference configuration is inconsistent."
            exit 1
          fi
          if ! jq -e 'all(.[] | select(.config.metadata.fly_platform_version == "v2");
            .state == "started" and .host_status == "ok" and all(.checks[]?; .status == "passing")
          )' <<<"${machines}" >/dev/null; then
            echo "::error::Every managed target machine must be healthy."
            exit 1
          fi
          if ! jq -e --arg volume "${MONITOR_VOLUME_ID}" '
            [.[] | select(
              .config.metadata.fly_process_group == "monitor" and
              .state == "started" and
              any(.config.mounts[]?;
                (.path == "/var/lib/postil-monitor") and
                ((.volume // .volume_id) == $volume)
              )
            )] | length == 1
          ' <<<"${machines}" >/dev/null; then
            echo "::error::Private monitor is not using the provisioned durable state volume."
            exit 1
          fi
          mapfile -t machine_ids < <(jq -r '.[] | select(
            .config.metadata.fly_platform_version == "v2" and
            (.config.metadata.fly_process_group == "web" or
             .config.metadata.fly_process_group == "worker" or
             .config.metadata.fly_process_group == "monitor")
          ) | .id' <<<"${machines}")
          for id in "${machine_ids[@]}"; do
            if ! release_contract=$(flyctl machine exec "${id}" \
              "bun -e 'const contract = [process.env.POSTIL_RELEASE_SHA, process.env.POSTIL_COMPATIBLE_SOURCE_RELEASE_SHA, process.env.POSTIL_RELEASE_PROTOCOL, process.env.POSTIL_MANAGED_RELEASE]; process.stdout.write(JSON.stringify(contract))'" \
              --app postil-web --timeout 15 2>/dev/null); then
              echo "::error::A managed machine did not report its release contract."
              exit 1
            fi
            if ! jq -e \
              --arg target "${TARGET_RELEASE_SHA}" \
              --arg source "${SOURCE_RELEASE_SHA}" \
              '. == [$target, $source, "additive-publication-hosted-v1", "1"]' \
              <<<"${release_contract}" >/dev/null; then
              echo "::error::A managed machine does not match the target release contract."
              exit 1
            fi
          done
          fly_secrets=$(flyctl secrets list --app postil-web --json)
          if ! jq -e --slurpfile source "${RUNNER_TEMP}/postil-source-secrets.json" '
            (map({name, digest, status}) | sort_by(.name)) == $source[0]
          ' <<<"${fly_secrets}" >/dev/null; then
            echo "::error::Fly secret metadata changed during deployment; target verification failed."
            exit 1
          fi
          echo "Managed target fleet verified."
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          MONITOR_VOLUME_ID: ${{ steps.monitor-volume.outputs.volume-id }}
          SOURCE_RELEASE_SHA: ${{ steps.source-fleet.outputs.release-sha }}
      - name: Verify additive release preparation
        id: activate
        timeout-minutes: 5
        run: |
          set -euo pipefail
          machine_id=$(flyctl machine list --app postil-web --json | jq -er '
            [.[] | select(
              .state == "started" and
              .config.metadata.fly_platform_version == "v2" and
              .config.metadata.fly_process_group == "worker"
            ) | .id] | if length >= 1 then .[0] else error("no managed worker is available") end
          ')
          flyctl machine exec "${machine_id}" \
            "bun run jobs:activate-release" \
            --app postil-web --timeout 60
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Roll back an incomplete managed replacement
        id: rollback
        if: ${{ always() && steps.source-fleet.outcome == 'success' && steps.secret-contract.outcome == 'success' && steps.deploy.outcome != 'skipped' && (steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.activate.outcome == 'failure') }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          [[ "${SOURCE_IMAGE}" =~ ^registry\.fly\.io/postil-web@sha256:[0-9a-f]{64}$ ]]
          verify_source_secrets() {
            local fly_secrets
            fly_secrets=$(flyctl secrets list --app postil-web --json) || return 1
            if ! jq -e --slurpfile source "${RUNNER_TEMP}/postil-source-secrets.json" '
              (map({name, digest, status}) | sort_by(.name)) == $source[0]
            ' <<<"${fly_secrets}" >/dev/null; then
              echo "::error::Fly secret metadata changed; rollback cannot apply staged or changed secrets."
              return 1
            fi
          }
          verify_source_secrets
          machines=$(flyctl machine list --app postil-web --json)
          # flyctl generates release identity and client-version metadata.
          # All runtime configuration, including environment and mounts, must
          # retain the original source values throughout this content rollout.
          if ! jq -e --slurpfile source "${RUNNER_TEMP}/postil-source-machines.json" '
            def runtime_config: .config | del(.image,
              .metadata.fly_release_id, .metadata.fly_release_version, .metadata.fly_flyctl_version);
            [.[] | select(
              .config.metadata.fly_process_group == "web" or
              .config.metadata.fly_process_group == "worker" or
              .config.metadata.fly_process_group == "monitor"
            )] as $managed |
            ([$managed[].id] | sort) == ([$source[0][].id] | sort) and
            all($managed[]; . as $machine |
              any($source[0][];
                .id == $machine.id and .region == $machine.region and
                runtime_config == ($machine | runtime_config)))
          ' <<<"${machines}" >/dev/null; then
            echo "::error::Rollback requires the captured machine identities and original source configuration."
            exit 1
          fi
          mapfile -t machine_ids < <(jq -r 'sort_by(.config.metadata.fly_process_group)[] | .id' "${RUNNER_TEMP}/postil-source-machines.json")
          umask 077
          for id in "${machine_ids[@]}"; do
            flyctl machine status "${id}" --app postil-web --json > "${RUNNER_TEMP}/postil-before-update.json"
            if ! jq -e --slurpfile source "${RUNNER_TEMP}/postil-source-machines.json" --arg id "${id}" '
              def runtime_config: .config | del(.image,
                .metadata.fly_release_id, .metadata.fly_release_version, .metadata.fly_flyctl_version);
              . as $machine | .id == $id and any($source[0][];
                .id == $machine.id and .region == $machine.region and
                runtime_config == ($machine | runtime_config))
            ' "${RUNNER_TEMP}/postil-before-update.json" >/dev/null; then
              echo "::error::Machine configuration differs from the original source snapshot; rollback stopped."
              exit 1
            fi
            current_image=$(jq -r '.image_ref.registry + "/" + .image_ref.repository + "@" + .image_ref.digest' "${RUNNER_TEMP}/postil-before-update.json")
            if [[ "${current_image}" == "${SOURCE_IMAGE}" ]]; then
              continue
            fi
            release=$(flyctl machine exec "${id}" \
              "bun -e 'process.stdout.write(process.env.POSTIL_RELEASE_SHA ?? \"\")'" \
              --app postil-web --timeout 15 2>/dev/null)
            if [[ "${release}" != "${TARGET_RELEASE_SHA}" ]]; then
              echo "::error::Rollback cannot replace a machine outside the captured source and attempted target releases."
              exit 1
            fi
            verify_source_secrets
            # Each update retains the machine configuration and attached volume.
            if ! flyctl machine update "${id}" --app postil-web \
              --image "${SOURCE_IMAGE}" --wait-timeout 120 --yes >/dev/null 2>&1; then
              echo "::error::A captured machine could not return to the source image."
              exit 1
            fi
            restored=$(flyctl machine status "${id}" --app postil-web --json)
            if ! jq -e --slurpfile source "${RUNNER_TEMP}/postil-source-machines.json" --arg image "${SOURCE_IMAGE}" --arg id "${id}" '
              def runtime_config: .config | del(.image,
                .metadata.fly_release_id, .metadata.fly_release_version, .metadata.fly_flyctl_version);
              . as $machine | .id == $id and any($source[0][];
                .id == $machine.id and .region == $machine.region and
                runtime_config == ($machine | runtime_config)) and
              (.image_ref.registry + "/" + .image_ref.repository + "@" + .image_ref.digest) == $image and
              .state == "started"
            ' <<<"${restored}" >/dev/null; then
              echo "::error::Rollback changed machine configuration or failed to restore the source image."
              exit 1
            fi
          done
          verify_source_secrets
          machines=$(flyctl machine list --app postil-web --json)
          machines=$(jq '[.[] | select(
            .config.metadata.fly_process_group == "web" or
            .config.metadata.fly_process_group == "worker" or
            .config.metadata.fly_process_group == "monitor"
          ) | .config.image = (.image_ref.registry + "/" + .image_ref.repository + "@" + .image_ref.digest)]' <<<"${machines}")
          if ! jq -e --arg image "${SOURCE_IMAGE}" 'all(.[];
            .config.image == $image and .state == "started" and .host_status == "ok" and
            all(.checks[]?; .status == "passing")
          )' <<<"${machines}" >/dev/null || ! jq -ce -f scripts/verify-managed-fleet.jq <<<"${machines}" >/dev/null; then
            echo "::error::The source fleet did not recover to a healthy homogeneous state."
            exit 1
          fi
          while IFS= read -r id; do
            if ! release=$(flyctl machine exec "${id}" \
              "bun -e 'process.stdout.write(process.env.POSTIL_RELEASE_SHA ?? \"\")'" \
              --app postil-web --timeout 15 2>/dev/null); then
              echo "::error::A restored machine did not report its release SHA."
              exit 1
            fi
            if [[ "${release}" != "${SOURCE_RELEASE_SHA}" ]]; then
              echo "::error::The rollback did not restore the exact source release."
              exit 1
            fi
          done < <(jq -r '.[] | select(
            .config.metadata.fly_platform_version == "v2" and
            (.config.metadata.fly_process_group == "web" or
             .config.metadata.fly_process_group == "worker" or
             .config.metadata.fly_process_group == "monitor")
          ) | .id' <<<"${machines}")
          echo "Managed source fleet restored without changing release capabilities."
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SOURCE_IMAGE: ${{ steps.source-fleet.outputs.image }}
          SOURCE_RELEASE_SHA: ${{ steps.source-fleet.outputs.release-sha }}
