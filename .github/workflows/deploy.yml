name: Deploy to Fly

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  verify-review:
    name: Verify postil/review passed
    runs-on: ubuntu-latest
    steps:
      - name: Check review gate
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const { data: checksOnCommit } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const reviewOnCommit = checksOnCommit.check_runs.find(r => r.name === 'postil/review');
            if (reviewOnCommit && reviewOnCommit.conclusion === 'success') {
              console.log('postil/review passed on commit');
              return;
            }
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            if (prs.length === 0) {
              core.setFailed('No postil/review check found on this commit, and no associated PR');
              return;
            }
            const pr = prs[0];
            if (pr.state === 'closed' && pr.merged_at) {
              console.log(`PR #${pr.number} is already merged; review gate satisfied`);
              return;
            }
            const headSha = pr.head.sha;
            const { data: checksOnHead } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
            });
            const reviewOnHead = checksOnHead.check_runs.find(r => r.name === 'postil/review');
            if (!reviewOnHead || reviewOnHead.conclusion !== 'success') {
              core.setFailed('postil/review did not pass for the associated PR');
              return;
            }
            console.log('postil/review passed on PR head');

  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-latest
    needs: verify-review
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy to Fly
        run: flyctl deploy --remote-only --app postil-web
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
