name: deploy

on:
  # Deploy only after the ci workflow has completed successfully on main,
  # not merely on push: ci and deploy used to run in parallel off the same
  # push event, so a merge commit that failed post-merge CI could still
  # deploy while its own test run was still in flight or had failed.
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skips quietly until the FLY_DEPLOY_ENABLED repo variable is set to
    # 'true' (and the FLY_API_TOKEN secret is configured). Also skips a
    # workflow_run event whose ci run did not succeed; workflow_dispatch
    # (manual deploy) has no associated ci run and always proceeds.
    if: vars.FLY_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Bake the pinned CLI into the image so the worker can spawn it.
      # POSTIL_CLI_TAG is a required repo variable naming a compatible
      # postil-cli release tag; this step always runs on deploy so
      # vendor/postil is always populated with a cosign-verified binary
      # before the image is built. The Dockerfile has no fetch fallback of
      # its own and fails the build if vendor/postil is absent, so this step
      # is what actually authenticates the CLI binary that ships in the
      # image.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Fetch pinned postil CLI
        # Four assets are fetched serially. Each curl can spend
        # (1 initial attempt + 5 retries) * 60s max-time + 5 * 2s retry-delay
        # = 370s, so 4 * 370s = 1480s worst case before verification/install.
        timeout-minutes: 30
        env:
          TAG: ${{ vars.POSTIL_CLI_TAG }}
        run: |
          set -euo pipefail
          if [[ -z "${TAG}" ]]; then
            echo "::error::POSTIL_CLI_TAG must name a compatible postil-cli release."
            exit 1
          fi
          if [[ ! "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::POSTIL_CLI_TAG must be a stable vMAJOR.MINOR.PATCH release."
            exit 1
          fi
          expected_tag="$(node -e 'process.stdout.write(require("./src/data/public-cli-release.json").cliRelease)')"
          if [[ "${TAG}" != "${expected_tag}" ]]; then
            echo "::error::POSTIL_CLI_TAG ${TAG} differs from the repository release authority ${expected_tag}."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          if (( major == 0 && minor < 5 )); then
            echo "::error::POSTIL_CLI_TAG ${TAG} is incompatible; v0.5.0 or newer is required."
            exit 1
          fi
          if grep -q '^POSTIL_PROVISIONAL_HOSTED_ROSTER = "1"$' fly.toml \
            && (( major == 0 && minor < 7 )); then
            echo "::error::The provisional hosted roster requires postil-cli v0.7.0 or newer. Update public-cli-release.json and POSTIL_CLI_TAG to the exact published release."
            exit 1
          fi
          base="https://github.com/postil-dev/postil-cli/releases/download/${TAG}"
          art="postil-x86_64-unknown-linux-gnu.tar.gz"
          tmp=""
          cleanup() {
            if [[ -n "${tmp}" && -d "${tmp}" ]]; then
              rm -rf "${tmp}"
            fi
            rm -f vendor/postil.tmp
          }
          trap cleanup EXIT INT TERM
          if ! tmp="$(mktemp -d)" || [[ -z "${tmp}" || ! -d "${tmp}" ]]; then
            echo "::error::Failed to create temporary directory for postil CLI download."
            exit 1
          fi

          fetch_asset() {
            local name="$1"
            curl --fail --show-error --silent --location \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 10 \
              --max-time 60 \
              --output "${tmp}/${name}" \
              "${base}/${name}"
          }

          fetch_asset "${art}"
          fetch_asset "${art}.sha256"
          fetch_asset "${art}.sig"
          fetch_asset "${art}.pem"
          (cd "$tmp" && sha256sum -c "${art}.sha256")
          # Checksum guards transit corruption only; the Sigstore signature is
          # tied to postil-cli's own release.yml workflow identity via keyless
          # OIDC and is what actually proves this artifact came from there.
          cosign verify-blob "${tmp}/${art}" \
            --signature "${tmp}/${art}.sig" \
            --certificate "${tmp}/${art}.pem" \
            --certificate-identity-regexp 'https://github.com/postil-dev/postil-cli/\.github/workflows/release\.yml@refs/tags/.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          mkdir -p vendor
          rm -f vendor/postil.tmp
          tar -xzf "${tmp}/${art}" -C "$tmp" postil
          if [[ ! -x "${tmp}/postil" ]]; then
            echo "::error::Extracted postil binary is missing or not executable."
            exit 1
          fi
          install -m 0755 "${tmp}/postil" vendor/postil.tmp
          mv -f vendor/postil.tmp vendor/postil
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.4
      - name: Load deployment secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://eu.infisical.com
          secret-path: /postil
      - name: Stage runtime secrets
        run: |
          set -euo pipefail
          # Secrets are piped straight to flyctl; they never touch disk.
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::Infisical did not provide DATABASE_URL."
            exit 1
          fi
          staged=""
          token="${POSTHOG_PROJECT_TOKEN:-${NEXT_PUBLIC_POSTHOG_KEY:-}}"
          if [[ -n "${token}" ]]; then
            staged+="POSTHOG_PROJECT_TOKEN=${token}"$'\n'
          fi
          staged+="DATABASE_URL=${DATABASE_URL}"$'\n'
          if [[ -n "${BREVO_API_KEY:-}" ]]; then
            staged+="BREVO_API_KEY=${BREVO_API_KEY}"$'\n'
          fi
          paddle_secret_names=(
            PADDLE_API_KEY
            PADDLE_CLIENT_TOKEN
            PADDLE_WEBHOOK_SECRET
            PADDLE_ZERO_BASE_PRICE_ID
            PADDLE_ACTIVE_AUTHOR_PRICE_ID
          )
          for name in "${paddle_secret_names[@]}"; do
            value="${!name:-}"
            if [[ -n "${value}" ]]; then
              staged+="${name}=${value}"$'\n'
            fi
          done
          if [[ -n "${staged}" ]]; then
            printf '%s' "${staged}" | flyctl secrets import --stage
          fi
          # The pinned CLI release owns the hosted roster. Remove legacy
          # runtime overrides so a release promotion cannot be shadowed by
          # stale repository variables or Fly secrets.
          runtime_override_secrets=()
          fly_secrets=$(flyctl secrets list --json)
          secret_names=$(jq -r '[.[] | .Name // .name // empty] | .[]' <<<"${fly_secrets}")
          while IFS= read -r name; do
            case "${name}" in
              POSTIL_HOSTED_INFERENCE_ENABLED|POSTIL_PROVISIONAL_HOSTED_ROSTER|REVIEW_MODEL|REVIEW_MODEL_CASCADE) runtime_override_secrets+=("${name}") ;;
            esac
          done <<<"${secret_names}"
          if (( ${#runtime_override_secrets[@]} > 0 )); then
            flyctl secrets unset --stage "${runtime_override_secrets[@]}"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      - name: Deploy managed fleet
        id: deploy
        timeout-minutes: 10
        run: |
          flyctl deploy \
            --remote-only \
            --build-arg POSTIL_CLI_REV="${POSTIL_CLI_TAG}" \
            --build-arg POSTIL_RELEASE_SHA="${GITHUB_SHA}" \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST="${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          POSTIL_CLI_TAG: ${{ vars.POSTIL_CLI_TAG }}
      - name: Restart any machines left stopped by the deploy
        id: recover
        # Runtime diagnostics stay in private Fly logs and the operator
        # dashboard. Deployment CI emits only generic release status.
        # The worker and monitor process groups have no HTTP health check to
        # auto-wake them. A deploy that leaves a managed machine stopped needs
        # an explicit restart
        # or the review queue/webhook receiver stays dark until someone
        # notices and starts it by hand. Must run even when the flyctl deploy
        # step itself fails (a partial rolling deploy that times out waiting
        # for one machine's health check is exactly when this matters most;
        # a plain dependent step would be skipped by default on that failure).
        if: ${{ always() && steps.deploy.outcome != 'skipped' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          stopped=$(flyctl machine list --app postil-web --json | jq -r '.[] | select(
            .state == "stopped"
            and (.config.metadata.fly_process_group == "web" or .config.metadata.fly_process_group == "worker" or .config.metadata.fly_process_group == "monitor")
            and .config.metadata.fly_platform_version == "v2"
          ) | .id')
          if [ -z "$stopped" ]; then
            echo "No stopped machines after deploy."
          else
            for id in $stopped; do
              echo "Restarting one managed machine left stopped by deploy."
              flyctl machine start "$id" --app postil-web
            done
            sleep 15
          fi
          # fly.toml requires min_machines_running = 2 for the web group: a
          # stopped machine the proxy has to cold-start drops/retries webhook
          # deliveries. Surface the current count rather than assume the
          # restart above (or the deploy itself) actually achieved it. A
          # warning here because the release verifier below owns the hard
          # capacity gate after all managed process groups are inspected.
          web_running=$(flyctl machine list --app postil-web --json \
            | jq -r '[.[] | select(.config.metadata.fly_process_group == "web" and .state == "started")] | length')
          if [ "${web_running}" -lt 2 ]; then
            echo "::warning::Managed web capacity is below the configured minimum; release activation verification follows."
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify and activate release capabilities after fleet replacement
        id: activate
        # Migration 0020 stages new job kinds with an infinite
        # run_after. This runs only after flyctl deploy has replaced the managed
        # fleet, so no pre-capability worker can claim them. It retires the
        # quiesced escalation-email state, backfills billing contacts, then
        # activates private-review author enforcement, then atomically releases
        # every staged supported job. A failure leaves jobs safely staged and
        # fails the workflow for a retry.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          machines=$(flyctl machine list --app postil-web --json)
          if ! fleet_summary=$(jq -ce -f scripts/verify-managed-fleet.jq <<<"${machines}"); then
            echo "::error::Refusing to activate release capabilities: fleet image, process, or hosted-inference configuration is inconsistent."
            exit 1
          fi
          echo "Managed fleet verified."
          flyctl ssh console --app postil-web --command "bun run hosted:verify-provider"
          flyctl ssh console --app postil-web --command "bun run jobs:activate-release"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
