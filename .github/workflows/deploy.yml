name: Deploy to Fly

# Deploys on every push to main. The merge gate is enforced via branch
# protection requiring the postil/review check-run to be green.
# See POSA-82 for the branch-protection command.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy to Fly
        run: flyctl deploy --remote-only --app postil-web
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
