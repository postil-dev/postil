name: Trigger.dev Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/jobs/**"
      - "trigger.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/trigger-deploy.yml"
  workflow_dispatch:

concurrency:
  group: trigger-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_ENVIRONMENT: production
      DEPLOY_APP_NAME: ${{ secrets.DEPLOY_APP_NAME }}
      SECRET_PROVIDER_IDENTITY: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
      SECRET_PROVIDER_PROJECT: ${{ secrets.INFISICAL_PROJECT_SLUG }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fetch deployment environment
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ env.SECRET_PROVIDER_IDENTITY }}
          domain: https://eu.infisical.com
          project-slug: ${{ env.SECRET_PROVIDER_PROJECT }}
          env-slug: prod
          secret-path: /postil
          export-type: env

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Allow depot CLI postinstall
        run: bun pm trust @depot/cli

      - name: Install flyctl CLI
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Sync watchdog token
        env:
          DEPLOY_APP_NAME: ${{ env.DEPLOY_APP_NAME }}
          REPOSITORY_WATCHDOG_TOKEN: ${{ secrets.METRICS_API_KEY }}
        run: |
          command -v flyctl >/dev/null || {
            echo "::error title=Missing deploy CLI::Install flyctl before syncing the watchdog token."
            exit 1
          }
          flyctl version

          DEPLOY_TOKEN="$(printenv FLY_TOKEN || true)"
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "::error title=Missing deploy token::Configure the production deployment token."
            exit 1
          fi
          if [ -z "${DEPLOY_APP_NAME:-}" ]; then
            echo "::error title=Missing deploy target::Set DEPLOY_APP_NAME for the production environment."
            exit 1
          fi
          WATCHDOG_TOKEN="${METRICS_API_KEY:-${REPOSITORY_WATCHDOG_TOKEN:-}}"
          if [ -z "${WATCHDOG_TOKEN:-}" ]; then
            echo "::error title=Missing watchdog token::Configure the production watchdog token."
            exit 1
          fi

          export FLY_API_TOKEN="${DEPLOY_TOKEN}"
          flyctl secrets set --app "${DEPLOY_APP_NAME}" METRICS_API_KEY="${WATCHDOG_TOKEN}"

      - name: Deploy trigger.dev tasks
        env:
          REPOSITORY_TASK_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          REPOSITORY_TASK_PAT: ${{ secrets.TRIGGER_PAT }}
          REPOSITORY_TASK_PROJECT_ID: ${{ secrets.TRIGGER_PROJECT_ID }}
          REPOSITORY_TRIGGER_SECRET_KEY: ${{ secrets.TRIGGER_SECRET_KEY }}
          REPOSITORY_REVIEW_TOKEN_SECRET: ${{ secrets.REVIEW_TOKEN_SECRET }}
          REPOSITORY_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REPOSITORY_NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          REPOSITORY_GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          REPOSITORY_GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          REPOSITORY_GITHUB_APP_PRIVATE_KEY_B64: ${{ secrets.GITHUB_APP_PRIVATE_KEY_B64 }}
          REPOSITORY_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          export TRIGGER_ACCESS_TOKEN="${TRIGGER_ACCESS_TOKEN:-${TRIGGER_PAT:-${REPOSITORY_TASK_ACCESS_TOKEN:-${REPOSITORY_TASK_PAT:-}}}}"
          export TRIGGER_PROJECT_ID="${TRIGGER_PROJECT_ID:-${REPOSITORY_TASK_PROJECT_ID:-}}"
          export TRIGGER_SECRET_KEY="${TRIGGER_SECRET_KEY:-${REPOSITORY_TRIGGER_SECRET_KEY:-}}"
          # REVIEW_TOKEN_SECRET is intentionally separate from TRIGGER_SECRET_KEY:
          # TRIGGER_SECRET_KEY is the Trigger runtime dispatch key (tr_prod_...),
          # while REVIEW_TOKEN_SECRET encrypts GitHub installation tokens.
          export REVIEW_TOKEN_SECRET="${REVIEW_TOKEN_SECRET:-${REPOSITORY_REVIEW_TOKEN_SECRET:-}}"
          export POSTIL_CLI_PATH="${POSTIL_CLI_PATH:-/home/bun/.cargo/bin/postil}"
          export DATABASE_URL="${DATABASE_URL:-${REPOSITORY_DATABASE_URL:-}}"
          export NEON_CONNECTION_STRING="${NEON_CONNECTION_STRING:-${REPOSITORY_NEON_CONNECTION_STRING:-}}"
          export GITHUB_APP_ID="${GITHUB_APP_ID:-${REPOSITORY_GITHUB_APP_ID:-}}"
          export GITHUB_APP_PRIVATE_KEY="${GITHUB_APP_PRIVATE_KEY:-${REPOSITORY_GITHUB_APP_PRIVATE_KEY:-}}"
          export GITHUB_APP_PRIVATE_KEY_B64="${GITHUB_APP_PRIVATE_KEY_B64:-${REPOSITORY_GITHUB_APP_PRIVATE_KEY_B64:-}}"
          export OPENROUTER_API_KEY="${OPENROUTER_API_KEY:-${REPOSITORY_OPENROUTER_API_KEY:-}}"

          if [ -z "${TRIGGER_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Missing task access token::Configure the Trigger CLI deploy PAT (tr_pat_...) as TRIGGER_ACCESS_TOKEN or TRIGGER_PAT."
            exit 1
          fi
          if [ -z "${TRIGGER_PROJECT_ID:-}" ]; then
            echo "::error title=Missing task project::Configure the production task project."
            exit 1
          fi
          if [ -z "${REVIEW_TOKEN_SECRET:-}" ]; then
            echo "::error title=Missing review token runtime secret::Configure REVIEW_TOKEN_SECRET in the production task environment."
            exit 1
          fi
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error title=Missing review model key::Configure OPENROUTER_API_KEY in the production task environment."
            exit 1
          fi

          bun trigger deploy --skip-update-check --env prod
