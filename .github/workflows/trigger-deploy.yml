name: Trigger.dev Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/jobs/**"
      - "trigger.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/trigger-deploy.yml"
  workflow_dispatch:

concurrency:
  group: trigger-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Allow depot CLI postinstall
        run: bun pm trust @depot/cli

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Sync watchdog token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}
          METRICS_API_KEY: ${{ secrets.METRICS_API_KEY }}
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error title=Missing Fly token::Set FLY_TOKEN as a repository or organization secret."
            exit 1
          fi
          if [ -z "${FLY_APP:-}" ]; then
            echo "::error title=Missing Fly app::Set FLY_APP as a repository or organization secret."
            exit 1
          fi
          if [ -z "${METRICS_API_KEY:-}" ]; then
            echo "::error title=Missing watchdog token::Set METRICS_API_KEY as a repository or organization secret."
            exit 1
          fi

          flyctl secrets set --stage --app "${FLY_APP}" METRICS_API_KEY="${METRICS_API_KEY}"

      - name: Deploy trigger.dev tasks
        run: bun trigger deploy --skip-update-check --env prod
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_PAT }}
          TRIGGER_PROJECT_ID: ${{ secrets.TRIGGER_PROJECT_ID }}
