name: Trigger.dev Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/jobs/**"
      - "trigger.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/trigger-deploy.yml"
  workflow_dispatch:

concurrency:
  group: trigger-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          domain: https://eu.infisical.com
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /postil
          export-type: env

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Allow depot CLI postinstall
        run: bun pm trust @depot/cli

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Sync watchdog token to Fly
        env:
          FLY_API_TOKEN: ${{ env.FLY_TOKEN }}
          METRICS_API_KEY: ${{ secrets.METRICS_API_KEY }}
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error title=Missing Fly token::FLY_TOKEN was not exported by Infisical."
            exit 1
          fi

          if [ -z "${METRICS_API_KEY:-}" ]; then
            echo "::error title=Missing watchdog token::Set METRICS_API_KEY as a repository or organization secret."
            exit 1
          fi

          flyctl secrets set --stage METRICS_API_KEY="${METRICS_API_KEY}" --app postil-web

      - name: Deploy trigger.dev tasks
        run: |
          if [ -z "${TRIGGER_PROJECT_ID:-}" ]; then
            echo "::error title=Missing Trigger project::TRIGGER_PROJECT_ID was not exported by Infisical or set as a repository secret."
            exit 1
          fi

          bun trigger deploy --skip-update-check --env prod
        env:
          TRIGGER_ACCESS_TOKEN: ${{ env.TRIGGER_PAT || secrets.TRIGGER_PAT }}
          TRIGGER_PROJECT_ID: ${{ env.TRIGGER_PROJECT_ID || secrets.TRIGGER_PROJECT_ID }}
