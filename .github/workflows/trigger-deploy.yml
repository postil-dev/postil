name: Trigger.dev Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/jobs/**"
      - "trigger.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/trigger-deploy.yml"
  workflow_dispatch:

concurrency:
  group: trigger-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          domain: https://eu.infisical.com
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /postil
          export-type: env

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Allow depot CLI postinstall
        run: bun pm trust @depot/cli

      - name: Verify Trigger deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${TRIGGER_PAT:-}" ]; then
            echo "::error title=Missing Trigger deploy token::TRIGGER_PAT must be available from Infisical for Trigger.dev deploys."
            missing=1
          fi
          if [ -z "${TRIGGER_PROJECT_ID:-}" ]; then
            echo "::error title=Missing Trigger project::TRIGGER_PROJECT_ID must be available from Infisical for Trigger.dev deploys."
            missing=1
          fi
          exit "$missing"

      - name: Deploy trigger.dev tasks
        shell: bash
        run: |
          set -euo pipefail
          TRIGGER_ACCESS_TOKEN="$TRIGGER_PAT" \
          TRIGGER_PROJECT_ID="$TRIGGER_PROJECT_ID" \
            bun trigger deploy --skip-update-check --env prod
