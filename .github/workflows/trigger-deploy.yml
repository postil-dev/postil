name: Trigger.dev Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/jobs/**"
      - "trigger.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/trigger-deploy.yml"
  workflow_dispatch:

concurrency:
  group: trigger-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          domain: https://eu.infisical.com
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /postil
          export-type: env

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Allow depot CLI postinstall
        run: bun pm trust @depot/cli

      - name: Deploy trigger.dev tasks
        run: bun trigger deploy --skip-update-check --env dev
        env:
          TRIGGER_ACCESS_TOKEN: ${{ env.TRIGGER_PAT }}
