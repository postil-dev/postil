name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Verify fresh database migrations and notification backfill
        run: |
          createdb postil_migrations
          bun run db:migrate
          bun run notifications:backfill-verification --dry-run
        env:
          PGHOST: localhost
          PGUSER: postgres
          DATABASE_URL: postgresql://postgres@localhost:5432/postil_migrations
          POSTIL_SEALING_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      - run: bun run test
      - run: bun test tests/model-override-migration.test.ts
        env:
          POSTIL_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      - run: bun test tests/finding-approvals-migration.test.ts
        env:
          POSTIL_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      - run: bun test tests/watchdog.test.ts
        env:
          POSTIL_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      - run: bun run build
      - run: bun run verify:dashboard
        env:
          POSTIL_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
          POSTIL_DASHBOARD_SERVER: start
