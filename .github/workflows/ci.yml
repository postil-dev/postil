name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker image (no push)
        uses: docker/build-push-action@789f68658055d3ca993799b232b5c46dfe3f114d # v6
        with:
          context: .
          push: false
          tags: postil-web:ci-${{ github.sha }}

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build application
        run: bun run build

      - name: Run E2E tests
        run: bun run test:e2e

  pr-body:
    name: PR body style
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check PR body style
        env:
          GH_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/check-pr-body.sh

  verify-review:
    name: Verify postil/review passed
    runs-on: ubuntu-latest
    # Only run on PRs — skip push-to-main (postil/review is a PR-only gate).
    if: github.event_name != 'push' && github.ref != 'refs/heads/main'
    # Give the webhook time to create and complete the check-run.
    timeout-minutes: 8
    steps:
      - name: Check review gate
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        timeout-minutes: 7
        with:
          script: |
            const POLL_INTERVAL_MS = 15_000;
            const MAX_POLLS = 20;          // 20 × 15s = 5 min
            const INITIAL_DELAY_MS = 30_000; // wait 30s for webhook to fire

            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

            // workflow_dispatch bypass — used for manual testing.
            if (context.eventName === 'workflow_dispatch') {
              console.log('workflow_dispatch triggered; skipping review gate');
              return;
            }

            // Prefer PR head SHA — context.sha is the test-merge commit for pull_request events.
            const payloadPr = context.payload?.pull_request;
            const headSha = payloadPr?.head?.sha || context.sha;

            async function findCheckRun(ref) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
              });
              return data.check_runs.find(r => r.name === 'postil/review') || null;
            }

            // For merged PRs, the review gate was already enforced on the PR.
            if (payloadPr?.merged_at) {
              console.log('PR is already merged; review gate was enforced before merge.');
              return;
            }

            // Poll for the check-run to appear and complete.
            console.log(`Waiting for postil/review on ${headSha}...`);
            await sleep(INITIAL_DELAY_MS);

            for (let attempt = 1; attempt <= MAX_POLLS; attempt++) {
              const check = await findCheckRun(headSha);

              if (!check) {
                console.log(`Attempt ${attempt}/${MAX_POLLS}: check not found yet.`);
                if (attempt === MAX_POLLS) {
                  core.setFailed(
                    `postil/review check was never created on ${headSha} after ~5 minutes. ` +
                    'The Postil webhook may be misconfigured or down.'
                  );
                  return;
                }
                await sleep(POLL_INTERVAL_MS);
                continue;
              }

              if (check.status === 'in_progress' || check.status === 'queued') {
                console.log(`Attempt ${attempt}/${MAX_POLLS}: check ${check.status}...`);
                if (attempt === MAX_POLLS) {
                  core.setFailed(
                    `postil/review check did not complete after ~5 minutes (still ${check.status}). ` +
                    'The review may be stuck or taking too long.'
                  );
                  return;
                }
                await sleep(POLL_INTERVAL_MS);
                continue;
              }

              // Check is completed — evaluate conclusion.
              console.log(`postil/review completed with conclusion: ${check.conclusion}`);
              if (check.conclusion === 'success') {
                console.log('Review gate passed ✓');
                return;
              }
              // Failure, neutral, cancelled, timed_out, action_required — all block merge.
              core.setFailed(
                `postil/review concluded "${check.conclusion}" — this PR cannot be merged. ` +
                'Fix the review findings or re-run the review.'
              );
              return;
            }
