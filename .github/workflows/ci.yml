name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build application
        run: bun run build

      - name: Run E2E tests
        run: bun run test:e2e

  verify-review:
    name: Verify postil/review passed
    runs-on: ubuntu-latest
    if: github.event_name != 'push' && github.ref != 'refs/heads/main'
    steps:
      - name: Check review gate
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              console.log('workflow_dispatch triggered; skipping review gate');
              return;
            }
            const { data: checksOnCommit } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const reviewOnCommit = checksOnCommit.check_runs.find(r => r.name === 'postil/review');
            if (reviewOnCommit && reviewOnCommit.conclusion === 'success') {
              console.log('postil/review passed on commit');
              return;
            }
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            let pr = prs.length > 0 ? prs[0] : null;
            if (!pr) {
              const { data: closedPrs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                sort: 'updated',
                direction: 'desc',
                per_page: 20,
              });
              pr = closedPrs.find(p => p.merge_commit_sha === context.sha && p.merged_at);
            }
            if (!pr) {
              const query = `
                query($owner: String!, $repo: String!, $sha: GitObjectID!) {
                  repository(owner: $owner, name: $repo) {
                    object(oid: $sha) {
                      ... on Commit {
                        associatedPullRequests(first: 10) {
                          nodes { number mergedAt state }
                        }
                      }
                    }
                  }
                }
              `;
              try {
                const result = await github.graphql(query, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: context.sha,
                });
                const candidates = result?.repository?.object?.associatedPullRequests?.nodes ?? [];
                const mergedPr = candidates.find(p => p.mergedAt);
                if (mergedPr) {
                  pr = { number: mergedPr.number, state: mergedPr.state.toLowerCase(), merged_at: mergedPr.mergedAt };
                }
              } catch (gqlErr) {
                console.log('GraphQL fallback failed:', gqlErr.message);
              }
            }
            if (pr && pr.state === 'closed' && pr.merged_at) {
              console.log(`PR #${pr.number} is already merged; review gate satisfied`);
              return;
            }
            if (!pr) {
              core.setFailed('No postil/review check found on this commit, and no associated PR');
              return;
            }
            const headSha = pr.head.sha;
            const { data: checksOnHead } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
            });
            const reviewOnHead = checksOnHead.check_runs.find(r => r.name === 'postil/review');
            if (!reviewOnHead || reviewOnHead.conclusion !== 'success') {
              core.setFailed('postil/review did not pass for the associated PR');
              return;
            }
            console.log('postil/review passed on PR head');