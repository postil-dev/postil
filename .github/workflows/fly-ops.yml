name: fly-ops

# Temporary operational workflow for Fly inspection, operator-directed
# scaling, and monitoring secret import from repository secrets.
# Lives on an ops branch only and is dispatched with --ref; dispatch
# requires repository write access. Output is age-encrypted to the operator's
# key because this repository is public and run logs/artifacts are
# world-readable.

on:
  workflow_dispatch:
    inputs:
      command:
        description: Inspection to run
        required: true
        type: choice
        options:
          - status
          - logs
          - scale-worker-2
          - review-ledger
          - set-monitoring-secrets
          - monitor-health

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: Run inspection
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ILERT_INTEGRATION_KEY: ${{ secrets.ILERT_INTEGRATION_KEY }}
          POSTIL_MONITOR_HEARTBEAT_URL: ${{ secrets.POSTIL_MONITOR_HEARTBEAT_URL }}
          OPENROUTER_MANAGEMENT_API_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_API_KEY }}
          POSTIL_OPENROUTER_DEVELOPMENT_KEY_NAME: ${{ secrets.POSTIL_OPENROUTER_DEVELOPMENT_KEY_NAME }}
          POSTIL_OPENROUTER_PRODUCTION_KEY_NAME: ${{ secrets.POSTIL_OPENROUTER_PRODUCTION_KEY_NAME }}
          POSTIL_OPENROUTER_EMERGENCY_KEY_NAME: ${{ secrets.POSTIL_OPENROUTER_EMERGENCY_KEY_NAME }}
        run: |
          set -euo pipefail
          mkdir -p out
          case "${{ inputs.command }}" in
            status)
              flyctl status -a postil-web > out/status.txt 2>&1 || true
              flyctl machine list -a postil-web --json > out/machines.json 2>&1 || true
              flyctl scale show -a postil-web > out/scale.txt 2>&1 || true
              flyctl releases -a postil-web > out/releases.txt 2>&1 || true
              ;;
            logs)
              timeout 75 flyctl logs -a postil-web > out/logs.txt 2>&1 || true
              ;;
            review-ledger)
              flyctl ssh console -a postil-web --process-group worker \
                -C "bun scripts/inspect-review-ledger.ts" \
                > out/review-ledger.json 2>&1 || true
              ;;
            scale-worker-2)
              flyctl scale count worker=2 -a postil-web --yes > out/scale-result.txt 2>&1 || true
              flyctl machine list -a postil-web --json > out/machines.json 2>&1 || true
              ;;
            set-monitoring-secrets)
              import_status=0
              {
                printf 'ILERT_INTEGRATION_KEY=%s\n' "$ILERT_INTEGRATION_KEY"
                printf 'POSTIL_MONITOR_HEARTBEAT_URL=%s\n' "$POSTIL_MONITOR_HEARTBEAT_URL"
                printf 'OPENROUTER_MANAGEMENT_API_KEY=%s\n' "$OPENROUTER_MANAGEMENT_API_KEY"
                printf 'POSTIL_OPENROUTER_DEVELOPMENT_KEY_NAME=%s\n' "$POSTIL_OPENROUTER_DEVELOPMENT_KEY_NAME"
                printf 'POSTIL_OPENROUTER_PRODUCTION_KEY_NAME=%s\n' "$POSTIL_OPENROUTER_PRODUCTION_KEY_NAME"
                printf 'POSTIL_OPENROUTER_EMERGENCY_KEY_NAME=%s\n' "$POSTIL_OPENROUTER_EMERGENCY_KEY_NAME"
              } | flyctl secrets import -a postil-web > out/secrets-import.txt 2>&1 || import_status=$?
              echo "secrets import exit status: $import_status"
              flyctl secrets list -a postil-web > out/secrets-list.txt 2>&1 || true
              awk 'NR == 1 || /ILERT|HEARTBEAT|OPENROUTER/ { print $1 }' out/secrets-list.txt
              ;;
            monitor-health)
              flyctl machine list -a postil-web --json > out/machines.json 2>&1 || true
              jq -r '.[] | "\(.config.env.FLY_PROCESS_GROUP // "?") \(.state) updated=\(.updated_at)"' \
                out/machines.json 2>/dev/null || echo "machine list unavailable"
              timeout 75 flyctl logs -a postil-web > out/logs.txt 2>&1 || true
              for pattern in 'monitor_started' 'pass .* completed' 'pass failed' \
                'heartbeat ping failed' 'ILERT_INTEGRATION_KEY unset'; do
                printf '%s count: %s\n' "$pattern" "$(grep -cE "$pattern" out/logs.txt || true)"
              done
              grep -oE 'heartbeat ping failed: .*' out/logs.txt \
                | sed -E 's#[A-Za-z][A-Za-z0-9+.-]*://[^[:space:]]+#<url>#g; s#(pings|heartbeats)/[^[:space:]]+#\1/<key>#g' \
                | sort -u | head -5 || true
              ;;
          esac
          ls -la out
      - name: Encrypt output
        run: |
          set -euo pipefail
          tar -C out -czf payload.tgz .
          age -r age1j0ag0s3m4ut25mk2d5yv264fvptrcms37jkzd7gxennceymm43aq02rj36 \
            -o payload.tgz.age payload.tgz
          rm -rf out payload.tgz
      - name: Upload encrypted output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fly-ops-${{ inputs.command }}
          path: payload.tgz.age
          retention-days: 1
