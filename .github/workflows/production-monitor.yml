name: Production monitor

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke check production
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public endpoints
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          METRICS_API_KEY: ${{ secrets.METRICS_API_KEY }}
        run: |
          set -euo pipefail

          public_endpoints=(
            "site https://postil.dev/"
            "liveness https://postil.dev/api/health"
          )

          for endpoint in "${public_endpoints[@]}"; do
            name="${endpoint%% *}"
            url="${endpoint#* }"
            echo "Checking ${name}: ${url}"
            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --output /dev/null \
              "${url}"
          done

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${EVENT_SCHEDULE:-}" == "17 8 * * *" ]]; then
            echo "Checking dependencies: https://postil.dev/api/health/dependencies"
            mkdir -p .cache
            dependency_status="$(curl \
              --location \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --output .cache/dependencies.out \
              --write-out '%{http_code}' \
              "https://postil.dev/api/health/dependencies")"
            if [[ "${dependency_status}" != 2* ]]; then
              echo "Dependency check failed with HTTP ${dependency_status}"
              cat .cache/dependencies.out
              exit 1
            fi

            if [[ -n "${METRICS_API_KEY:-}" ]]; then
              trap 'rm -f .cache/curl-metrics.conf .cache/metrics.out .cache/dependencies.out' EXIT
              printf 'header = "Authorization: Bearer %s"\n' "${METRICS_API_KEY}" > .cache/curl-metrics.conf
              chmod 0600 .cache/curl-metrics.conf
              echo "Checking metrics: https://postil.dev/api/metrics"
              metrics_status="$(curl \
                --location \
                --silent \
                --show-error \
                --connect-timeout 5 \
                --max-time 15 \
                --config .cache/curl-metrics.conf \
                --output .cache/metrics.out \
                --write-out '%{http_code}' \
                "https://postil.dev/api/metrics")"
              if [[ "${metrics_status}" != 2* ]]; then
                echo "Metrics check failed with HTTP ${metrics_status}"
                cat .cache/metrics.out
                exit 1
              fi
              if ! grep -E '^postil_database_up 1$' .cache/metrics.out; then
                echo "Metrics check did not report postil_database_up 1"
                cat .cache/metrics.out
                exit 1
              fi
            fi
          fi
