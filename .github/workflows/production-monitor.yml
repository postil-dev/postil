name: Production monitor

on:
  schedule:
    # Every 15 minutes: this is the only automated detector of a dead or
    # stopped worker (postil_oldest_job_age_seconds staleness check below),
    # so the full metrics probe runs on this cadence rather than daily.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke check production
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public endpoints
        shell: bash
        env:
          METRICS_API_KEY: ${{ secrets.METRICS_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .cache
          trap 'rm -f .cache/curl-metrics.conf .cache/dependencies.out .cache/metrics.out .cache/headers.out .cache/robots.out' EXIT

          public_endpoints=(
            "site https://postil.dev/"
            "liveness https://postil.dev/api/health"
            "sitemap https://postil.dev/sitemap.xml"
            "favicon https://postil.dev/favicon.ico"
          )

          for endpoint in "${public_endpoints[@]}"; do
            name="${endpoint%% *}"
            url="${endpoint#* }"
            echo "Checking ${name}: ${url}"
            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --output /dev/null \
              "${url}"
          done

          echo "Checking robots: https://postil.dev/robots.txt"
          curl \
            --fail \
            --silent \
            --show-error \
            --header "Cache-Control: no-cache" \
            --connect-timeout 5 \
            --max-time 15 \
            --output .cache/robots.out \
            "https://postil.dev/robots.txt"
          if grep -E '^Disallow:' .cache/robots.out; then
            echo "robots.txt should not block crawlable noindex surfaces."
            cat .cache/robots.out
            exit 1
          fi
          grep -Fx "User-Agent: *" .cache/robots.out
          grep -Fx "Allow: /" .cache/robots.out
          grep -Fx "Sitemap: https://postil.dev/sitemap.xml" .cache/robots.out

          echo "Checking canonical redirects"
          about_redirect="$(curl \
            --silent \
            --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            --output /dev/null \
            --write-out '%{http_code} %{redirect_url}' \
            "https://postil.dev/about")"
          if [[ "${about_redirect}" != "308 https://postil.dev/why-postil" ]]; then
            echo "Unexpected /about redirect: ${about_redirect}"
            exit 1
          fi

          www_redirect="$(curl \
            --silent \
            --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            --output /dev/null \
            --write-out '%{http_code} %{redirect_url}' \
            "https://www.postil.dev/docs?utm_source=monitor")"
          if [[ "${www_redirect}" != "308 https://postil.dev/docs?utm_source=monitor" ]]; then
            echo "Unexpected www redirect: ${www_redirect}"
            exit 1
          fi

          for endpoint in \
            "login https://postil.dev/login" \
            "api-health https://postil.dev/api/health"; do
            name="${endpoint%% *}"
            url="${endpoint#* }"
            echo "Checking noindex header for ${name}: ${url}"
            curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --dump-header .cache/headers.out \
              --output /dev/null \
              "${url}"
            if ! grep -iq '^x-robots-tag: noindex, nofollow' .cache/headers.out; then
              echo "Missing X-Robots-Tag on ${url}"
              cat .cache/headers.out
              exit 1
            fi
          done

          echo "Checking dependencies: https://postil.dev/api/health/dependencies"
          dependency_status="$(curl \
            --location \
            --silent \
            --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            --output .cache/dependencies.out \
            --write-out '%{http_code}' \
            "https://postil.dev/api/health/dependencies")"
          if [[ "${dependency_status}" != 2* ]]; then
            echo "Dependency check failed with HTTP ${dependency_status}"
            cat .cache/dependencies.out
            exit 1
          fi

          if [[ -n "${METRICS_API_KEY:-}" ]]; then
            printf 'header = "Authorization: Bearer %s"\n' "${METRICS_API_KEY}" > .cache/curl-metrics.conf
            chmod 0600 .cache/curl-metrics.conf
            echo "Checking metrics: https://postil.dev/api/metrics"
            metrics_status="$(curl \
              --location \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --config .cache/curl-metrics.conf \
              --output .cache/metrics.out \
              --write-out '%{http_code}' \
              "https://postil.dev/api/metrics")"
            if [[ "${metrics_status}" != 2* ]]; then
              echo "Metrics check failed with HTTP ${metrics_status}"
              cat .cache/metrics.out
              exit 1
            fi
            if ! grep -E '^postil_database_up 1$' .cache/metrics.out; then
              echo "Metrics check did not report postil_database_up 1"
              cat .cache/metrics.out
              exit 1
            fi

            # A queued or running job stuck past REVIEW_DEADLINE_MS (10 min,
            # see src/worker/review.ts) should already have completed or
            # been swept by the watchdog. Anything still there past 30 min
            # is not normal backlog, it's a dead worker: the process group
            # can end up stopped after a deploy with no auto-wake (only the
            # web group has an http health check), and the review
            # queue/webhook receiver silently goes dark until noticed.
            stale_threshold_seconds=1800
            stale_found=0
            for status in queued running; do
              age=$(grep -E "^postil_oldest_job_age_seconds\{status=\"${status}\"\}" .cache/metrics.out \
                | awk '{print $2}')
              if [[ -n "${age:-}" ]] && (( $(printf '%.0f' "${age}") > stale_threshold_seconds )); then
                echo "Oldest ${status} job is ${age}s old (over ${stale_threshold_seconds}s) - worker may be stuck or stopped"
                stale_found=1
              fi
            done
            if [[ "${stale_found}" -eq 1 ]]; then
              echo "Full metrics for context:"
              cat .cache/metrics.out
              exit 1
            fi
          fi
