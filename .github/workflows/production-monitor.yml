name: Production monitor

on:
  workflow_run:
    workflows: ["deploy"]
    types: [completed]
  schedule:
    # Requested every 15 minutes; GitHub throttles scheduled workflows, so
    # observed cadence is best-effort (often hourly or worse). This workflow
    # is the deep-check safety net that runs outside the platform's failure
    # domain; minute-level liveness paging comes from the external alerting
    # service's uptime checks and the private monitor's heartbeat.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      reconcile_alert_stream:
        description: Reconcile the iLert webhook action and send then resolve a HIGH-priority production test alert; it can invoke the escalation path
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Deployment-completion monitors keep independent workflow owners, while
  # scheduled and manual checks serialize together. Each manual canary attempt
  # owns distinct iLert keys until its independent finalizer has run. Every
  # recovery attempt then joins the same bounded FIFO queue as deploys, so it
  # observes an idle managed fleet.
  group: ${{ github.event_name == 'workflow_run' && format('production-monitor-deploy-{0}', github.event.workflow_run.id) || 'production-monitor' }}
  queue: max
  cancel-in-progress: false

jobs:
  release-recovery:
    name: Recover abandoned release preparation
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success' }}
    concurrency:
      group: fly-deploy
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      clear: ${{ steps.verified.outputs.clear }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Find durable release preparation
        id: preparation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          pending_releases="$(bun scripts/run-release-migrations.ts --pending-releases)"
          if [[ -z "${pending_releases}" ]]; then
            if bun scripts/run-release-migrations.ts --verify-clear >/dev/null 2>&1; then
              echo "Release preparation is already active and clear."
              echo "present=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "Release capabilities are dark without a recovery journal."
            exit 1
          fi
          {
            echo "present=true"
            echo "targets<<POSTIL_RELEASES"
            printf '%s\n' "${pending_releases}"
            echo "POSTIL_RELEASES"
          } >> "${GITHUB_OUTPUT}"
      - name: Install checksum-pinned flyctl
        if: ${{ steps.preparation.outputs.present == 'true' }}
        env:
          FLYCTL_VERSION: 0.4.71
          FLYCTL_LINUX_X86_64_SHA256: a782dceed173d215c000ab94e2b08623c22267edff6d90ebe3010b3f9b671dc2
        run: |
          set -euo pipefail
          archive="flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          url="https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/${archive}"
          temporary_directory="$(mktemp -d)"
          trap 'rm -rf "${temporary_directory}"' EXIT
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --output "${temporary_directory}/${archive}" "${url}"
          printf '%s  %s\n' "${FLYCTL_LINUX_X86_64_SHA256}" "${temporary_directory}/${archive}" \
            | sha256sum --check --strict
          tar -xzf "${temporary_directory}/${archive}" -C "${temporary_directory}" flyctl
          install -m 0755 "${temporary_directory}/flyctl" "${RUNNER_TEMP}/flyctl"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Restore only an unchanged prior fleet
        id: restore
        if: ${{ steps.preparation.outputs.present == 'true' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EVENT_RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          PENDING_RELEASES: ${{ steps.preparation.outputs.targets }}
        run: |
          set -euo pipefail
          mapfile -t recovery_targets <<<"${PENDING_RELEASES}"
          recovery_target_sha="${recovery_targets[0]}"
          if [[ -n "${EVENT_RELEASE_SHA}" && "${recovery_target_sha}" != "${EVENT_RELEASE_SHA}" ]]; then
            echo "A newer release preparation owns recovery."
            echo "superseded=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          machines=$(flyctl machine list --app postil-web --json)
          if ! fleet_summary=$(jq -ce -f scripts/verify-managed-fleet.jq <<<"${machines}"); then
            echo "Managed fleet topology is invalid; release capabilities remain dark."
            exit 1
          fi
          managed_count=$(jq -r '.managed_count' <<<"${fleet_summary}")
          started_count=$(jq -r '[.[] | select(
            .state == "started" and
            (.config.metadata.fly_process_group == "web" or
             .config.metadata.fly_process_group == "worker" or
             .config.metadata.fly_process_group == "monitor")
          )] | length' <<<"${machines}")
          if [[ "${managed_count}" -lt 4 || "${started_count}" -ne "${managed_count}" ]]; then
            echo "Managed fleet state is incomplete; release capabilities remain dark."
            exit 1
          fi
          releases=()
          target_seen=0
          while IFS= read -r id; do
            # The flyctl execution timeout bounds every individual machine
            # probe; workflow timeout remains the independent outer bound.
            release=$(flyctl machine exec "${id}" \
              "bun -e 'process.stdout.write(process.env.POSTIL_RELEASE_SHA ?? \"\")'" \
              --app postil-web --timeout 15 2>/dev/null)
            if [[ ! "${release}" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "A managed machine did not report a valid release; capabilities remain dark."
              exit 1
            fi
            releases+=("${release}")
            for pending_release in "${recovery_targets[@]}"; do
              if [[ "${release}" == "${pending_release}" ]]; then
                target_seen=1
              fi
            done
          done < <(jq -r '.[] | select(
            .config.metadata.fly_process_group == "web" or
            .config.metadata.fly_process_group == "worker" or
            .config.metadata.fly_process_group == "monitor"
          ) | .id' <<<"${machines}")
          unique_release_count=$(printf '%s\n' "${releases[@]}" | sort -u | wc -l)
          if [[ "${#releases[@]}" -ne "${managed_count}" || "${unique_release_count}" -ne 1 ]]; then
            echo "The managed fleet is mixed; release capabilities remain dark."
            exit 1
          fi
          if [[ "${target_seen}" -ne 0 ]]; then
            echo "A pending release reached the managed fleet; capabilities remain dark."
            exit 1
          fi
          POSTIL_RELEASE_SHA="${recovery_target_sha}" \
            bun scripts/run-release-migrations.ts --compensate
      - name: Verify release recovery is clear
        id: verified
        if: ${{ always() && !cancelled() && steps.preparation.outcome == 'success' && steps.restore.outcome != 'failure' && steps.restore.outputs.superseded != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          bun scripts/run-release-migrations.ts --verify-clear
          echo "clear=true" >> "${GITHUB_OUTPUT}"

  smoke:
    name: Smoke check production
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check public endpoints
        shell: bash
        env:
          METRICS_API_KEY: ${{ secrets.METRICS_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .cache
          trap 'rm -f .cache/curl-metrics.conf .cache/dependencies.out .cache/metrics.out .cache/monitor-health.out .cache/monitor-health-headers.out .cache/headers.out .cache/robots.out' EXIT

          public_endpoints=(
            "site https://postil.dev/"
            "liveness https://postil.dev/api/health"
            "sitemap https://postil.dev/sitemap.xml"
            "favicon https://postil.dev/favicon.ico"
          )

          for endpoint in "${public_endpoints[@]}"; do
            name="${endpoint%% *}"
            url="${endpoint#* }"
            echo "Checking ${name}: ${url}"
            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --output /dev/null \
              "${url}"
          done

          monitor_health_failed=0
          monitor_health_status="$(curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --dump-header .cache/monitor-health-headers.out \
            --output .cache/monitor-health.out \
            --write-out '%{http_code}' \
            "https://postil.dev/api/health/monitor")" || monitor_health_failed=1
          echo "Monitor health HTTP status: ${monitor_health_status:-unavailable}"
          if [[ "${monitor_health_failed}" -eq 1 || "${monitor_health_status}" != 2* ]]; then
            echo "Monitor health endpoint reported an unhealthy state"
            if [[ -s .cache/monitor-health.out ]]; then
              cat .cache/monitor-health.out
            else
              echo "Monitor health response body is unavailable"
            fi
            monitor_health_failed=1
          fi

          echo "Checking robots: https://postil.dev/robots.txt"
          curl \
            --fail \
            --silent \
            --show-error \
            --header "Cache-Control: no-cache" \
            --connect-timeout 5 \
            --max-time 15 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --output .cache/robots.out \
            "https://postil.dev/robots.txt"
          if grep -E '^Disallow:' .cache/robots.out; then
            echo "robots.txt should not block crawlable noindex surfaces."
            cat .cache/robots.out
            exit 1
          fi
          grep -Fx "User-Agent: *" .cache/robots.out
          grep -Fx "Allow: /" .cache/robots.out
          grep -Fx "Sitemap: https://postil.dev/sitemap.xml" .cache/robots.out

          echo "Checking canonical redirects"
          about_redirect="$(curl \
            --silent \
            --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --output /dev/null \
            --write-out '%{http_code} %{redirect_url}' \
            "https://postil.dev/about")"
          if [[ "${about_redirect}" != "308 https://postil.dev/why-postil" ]]; then
            echo "Unexpected /about redirect: ${about_redirect}"
            exit 1
          fi

          www_redirect="$(curl \
            --silent \
            --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --output /dev/null \
            --write-out '%{http_code} %{redirect_url}' \
            "https://www.postil.dev/docs?utm_source=monitor")"
          if [[ "${www_redirect}" != "308 https://postil.dev/docs?utm_source=monitor" ]]; then
            echo "Unexpected www redirect: ${www_redirect}"
            exit 1
          fi

          for endpoint in \
            "login https://postil.dev/login" \
            "api-health https://postil.dev/api/health"; do
            name="${endpoint%% *}"
            url="${endpoint#* }"
            echo "Checking noindex header for ${name}: ${url}"
            curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --dump-header .cache/headers.out \
              --output /dev/null \
              "${url}"
            if ! grep -iq '^x-robots-tag: noindex, nofollow' .cache/headers.out; then
              echo "Missing X-Robots-Tag on ${url}"
              cat .cache/headers.out
              exit 1
            fi
          done

          echo "Checking noindex header for monitor health"
          if ! grep -iq '^x-robots-tag: noindex, nofollow' .cache/monitor-health-headers.out; then
            echo "Missing X-Robots-Tag on monitor health endpoint"
            if [[ -s .cache/monitor-health-headers.out ]]; then
              cat .cache/monitor-health-headers.out
            else
              echo "Monitor health response headers are unavailable"
            fi
            monitor_health_failed=1
          fi

          echo "Checking dependencies: https://postil.dev/api/health/dependencies"
          dependency_status="$(curl \
            --location \
            --silent \
            --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --output .cache/dependencies.out \
            --write-out '%{http_code}' \
            "https://postil.dev/api/health/dependencies")"
          if [[ "${dependency_status}" != 2* ]]; then
            echo "Dependency check failed with HTTP ${dependency_status}"
            cat .cache/dependencies.out
            exit 1
          fi

          if [[ -z "${METRICS_API_KEY:-}" ]]; then
            echo "METRICS_API_KEY is required; operational incident monitoring cannot run without it"
            exit 1
          fi
          if [[ -n "${METRICS_API_KEY:-}" ]]; then
            printf 'header = "Authorization: Bearer %s"\n' "${METRICS_API_KEY}" > .cache/curl-metrics.conf
            chmod 0600 .cache/curl-metrics.conf
            echo "Checking metrics: https://postil.dev/api/metrics"
            metrics_status="$(curl \
              --location \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --config .cache/curl-metrics.conf \
              --output .cache/metrics.out \
              --write-out '%{http_code}' \
              "https://postil.dev/api/metrics")"
            if [[ "${metrics_status}" != 2* ]]; then
              echo "Metrics check failed with HTTP ${metrics_status}"
              cat .cache/metrics.out
              exit 1
            fi
            if ! grep -E '^postil_database_up 1$' .cache/metrics.out; then
              echo "Metrics check did not report postil_database_up 1"
              cat .cache/metrics.out
              exit 1
            fi
            stale_found="${monitor_health_failed}"
            if ! grep -E '^postil_private_monitor_heartbeat_fresh 1$' .cache/metrics.out; then
              echo "Private monitor heartbeat is missing or stale"
              stale_found=1
            fi
            if ! grep -E '^postil_private_monitor_collection_fresh 1$' .cache/metrics.out; then
              echo "Private monitor collection is missing or stale"
              stale_found=1
            fi
            if ! grep -E '^postil_monitor_heartbeat_delivery_fresh 1$' .cache/metrics.out; then
              echo "External monitor heartbeat delivery is missing or stale"
              stale_found=1
            fi

            # A running review or queued/running job past 30 minutes should
            # have completed or been swept by the ten-minute watchdog. This
            # checks both ledgers because a dead worker can leave a review
            # running after its queue job has already reached a terminal state.
            stale_threshold_seconds=1800
            monitor_failures=$(awk \
              '$1 == "postil_private_monitor_consecutive_failed_passes" { print $2 }' \
              .cache/metrics.out)
            echo "Consecutive failed monitor passes: ${monitor_failures:-missing}"
            if [[ -z "${monitor_failures:-}" ]] || \
               (( $(printf '%.0f' "${monitor_failures:-0}") > 1 )); then
              echo "Private monitor has more than one consecutive failed pass or its metric is missing"
              stale_found=1
            fi
            monitor_running_age=$(awk \
              '$1 == "postil_private_monitor_running_pass_age_seconds" { print $2 }' \
              .cache/metrics.out)
            echo "Running monitor pass age: ${monitor_running_age:-missing}s"
            if [[ -z "${monitor_running_age:-}" ]] || \
               (( $(printf '%.0f' "${monitor_running_age:-0}") > 900 )); then
              echo "Private monitor pass is stuck or its metric is missing"
              stale_found=1
            fi
            review_age=$(grep -E '^postil_oldest_running_review_age_seconds ' .cache/metrics.out \
              | awk '{print $2}')
            echo "Oldest running review age: ${review_age:-missing}s"
            if [[ -z "${review_age:-}" ]]; then
              echo "Running-review age metric is missing"
              stale_found=1
            elif (( $(printf '%.0f' "${review_age}") > stale_threshold_seconds )); then
              echo "Oldest running review is ${review_age}s old (over ${stale_threshold_seconds}s) - watchdog may be stuck or stopped"
              stale_found=1
            fi
            cleanup_failures=$(awk \
              '$1 == "postil_check_run_cleanup_failures_30m" { print $2 }' \
              .cache/metrics.out)
            echo "Recent failed check-run cleanup jobs: ${cleanup_failures:-missing}"
            if [[ -z "${cleanup_failures:-}" ]] || \
               (( $(printf '%.0f' "${cleanup_failures:-0}") > 0 )); then
              echo "Recent check-run cleanup reached terminal failure or its metric is missing"
              stale_found=1
            fi
            operator_alert_failures=$(awk \
              '$1 == "postil_operator_alert_failures_current" { print $2 }' \
              .cache/metrics.out)
            echo "Unresolved operator email failures: ${operator_alert_failures:-missing}"
            if [[ -z "${operator_alert_failures:-}" ]] || \
               (( $(printf '%.0f' "${operator_alert_failures:-0}") > 0 )); then
              echo "Operator email delivery failed or its metric is missing"
              stale_found=1
            fi
            operator_alert_age=$(awk \
              '$1 == "postil_oldest_operator_alert_pending_age_seconds" { print $2 }' \
              .cache/metrics.out)
            echo "Oldest pending operator email age: ${operator_alert_age:-missing}s"
            if [[ -z "${operator_alert_age:-}" ]] || \
               (( $(printf '%.0f' "${operator_alert_age:-0}") > stale_threshold_seconds )); then
              echo "Operator email delivery is stale or its metric is missing"
              stale_found=1
            fi
            billing_failures=$(awk \
              '$1 == "postil_billing_settlement_failures_current" { print $2 }' \
              .cache/metrics.out)
            echo "Billing settlements requiring attention: ${billing_failures:-missing}"
            if [[ -z "${billing_failures:-}" ]] || \
               (( $(printf '%.0f' "${billing_failures:-0}") > 0 )); then
              echo "A billing settlement failed or its metric is missing"
              stale_found=1
            fi
            billing_age=$(awk \
              '$1 == "postil_oldest_billing_settlement_pending_age_seconds" { print $2 }' \
              .cache/metrics.out)
            echo "Oldest incomplete billing settlement age: ${billing_age:-missing}s"
            if [[ -z "${billing_age:-}" ]] || \
               (( $(printf '%.0f' "${billing_age:-0}") > 3600 )); then
              echo "Billing settlement reconciliation is stale or its metric is missing"
              stale_found=1
            fi
            unmatched_billing_events=$(awk \
              '$1 == "postil_unmatched_billing_provider_events_24h" { print $2 }' \
              .cache/metrics.out)
            echo "Unmatched billing events: ${unmatched_billing_events:-missing}"
            if [[ -z "${unmatched_billing_events:-}" ]] || \
               (( $(printf '%.0f' "${unmatched_billing_events:-0}") > 0 )); then
              echo "A verified billing event could not be mapped or its metric is missing"
              stale_found=1
            fi
            billing_checkout_age=$(awk \
              '$1 == "postil_oldest_billing_checkout_open_age_seconds" { print $2 }' \
              .cache/metrics.out)
            echo "Oldest incomplete billing checkout age: ${billing_checkout_age:-missing}s"
            if [[ -z "${billing_checkout_age:-}" ]] || \
               (( $(printf '%.0f' "${billing_checkout_age:-0}") > 3600 )); then
              echo "A self-service checkout is stale or its metric is missing"
              stale_found=1
            fi
            billing_checkout_failures=$(awk \
              '$1 == "postil_billing_checkout_failures_24h" { print $2 }' \
              .cache/metrics.out)
            echo "Failed billing checkouts: ${billing_checkout_failures:-missing}"
            if [[ -z "${billing_checkout_failures:-}" ]] || \
               (( $(printf '%.0f' "${billing_checkout_failures:-0}") > 0 )); then
              echo "A self-service checkout failed or its metric is missing"
              stale_found=1
            fi
            # Hard platform failures page at zero tolerance. Model-quality
            # incidents (a review retried after bad model output, a scorer or
            # model fallback) are self-healing and only page when they burst,
            # otherwise a single flaky upstream completion pages the operator.
            incident_found=0
            for category in operational_failure scorer_failure scorer_fallback model_fallback invalid_output failed_job; do
              count=$(awk -v metric="postil_review_incidents_30m{category=\"${category}\"}" \
                '$1 == metric { print $2 }' .cache/metrics.out)
              threshold=0
              case "${category}" in
                scorer_failure) threshold=2 ;;
                scorer_fallback) threshold=2 ;;
                model_fallback) threshold=5 ;;
                invalid_output) threshold=2 ;;
              esac
              echo "Recent ${category} incidents: ${count:-missing}"
              if [[ -z "${count:-}" ]]; then
                echo "Operational incident metric is missing for ${category}"
                incident_found=1
              elif (( $(printf '%.0f' "${count}") > threshold )); then
                echo "Postil reported ${count} ${category} incident(s) in the last 30 minutes (threshold ${threshold})"
                incident_found=1
              fi
            done
            for status in queued running; do
              age=$(grep -E "^postil_oldest_job_age_seconds\{status=\"${status}\"\}" .cache/metrics.out \
                | awk '{print $2}')
              echo "Oldest ${status} job age: ${age:-missing}s"
              if [[ -n "${age:-}" ]] && (( $(printf '%.0f' "${age}") > stale_threshold_seconds )); then
                echo "Oldest ${status} job is ${age}s old (over ${stale_threshold_seconds}s) - worker may be stuck or stopped"
                stale_found=1
              fi
            done
            if [[ "${stale_found}" -eq 1 || "${incident_found}" -eq 1 ]]; then
              echo "Full metrics for context:"
              cat .cache/metrics.out
              exit 1
            fi
          fi

  alert-stream:
    name: Reconcile and verify iLert webhook delivery
    needs: [smoke, release-recovery]
    outputs:
      alert-submitted: ${{ steps.canary.outputs.alert_submitted }}
      producer-attempt: ${{ steps.canary.outputs.producer_attempt }}
      started-at: ${{ steps.canary.outputs.started_at }}
    # Manual canaries run only after smoke succeeds; failed or cancelled
    # production checks must not emit a test page. Production failures use the
    # stable alert key owned by the notify and resolve jobs below.
    if: ${{ always() && inputs.reconcile_alert_stream == true && needs.smoke.result == 'success' && needs.release-recovery.result == 'success' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    # The 24-minute job budget reserves three minutes for setup, seven minutes
    # for preview reconciliation, thirteen for reconcile plus canary, and one
    # for runner overhead. The canary reserves its final two minutes for
    # repeated resolution verification before it can send ALERT.
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Load iLert management secret from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_ILERT_MACHINE_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://eu.infisical.com
          secret-path: /
          secret-name: ILERT_API_KEY
      - name: Load iLert integration secret from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://eu.infisical.com
          secret-path: /postil
          secret-name: ILERT_INTEGRATION_KEY
      - name: Load Postil webhook secret from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://eu.infisical.com
          secret-path: /postil
          secret-name: POSTIL_ILERT_WEBHOOK_SECRET
      - name: Preview iLert alert-stream reconciliation
        env:
          POSTIL_ILERT_ALERT_SOURCE_ID: ${{ vars.POSTIL_ILERT_ALERT_SOURCE_ID }}
          POSTIL_ILERT_RECEIVER_ORIGIN: https://postil.dev
        run: timeout 7m bun run scripts/reconcile-ilert-alert-stream.ts --dry-run
      - name: Reconcile and verify the attempt-specific iLert webhook canary
        id: canary
        env:
          POSTIL_ILERT_ALERT_SOURCE_ID: ${{ vars.POSTIL_ILERT_ALERT_SOURCE_ID }}
          POSTIL_ILERT_CANARY_RUN_ATTEMPT: ${{ github.run_attempt }}
          POSTIL_ILERT_CANARY_RUN_ID: ${{ github.run_id }}
          POSTIL_ILERT_RECEIVER_ORIGIN: https://postil.dev
        run: timeout 13m bun run scripts/reconcile-ilert-alert-stream.ts --canary

  alert-stream-finalize:
    name: Finalize iLert webhook canary cleanup
    needs: alert-stream
    # This separate job runs after success, failure, cancellation, or timeout.
    # A cleaned handoff means the primary canary already proved exact persisted
    # receiver create and resolve events. Other handoffs prove iLert management
    # state has no open deterministic alert, or fail closed.
    if: ${{ always() && inputs.reconcile_alert_stream == true && needs.alert-stream.result != 'skipped' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    # The finalizer has three minutes for setup, twelve for bounded discovery
    # and cleanup, and five minutes of runner headroom. It never reconciles the action.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Load iLert management secret from Infisical
        if: ${{ needs.alert-stream.outputs.alert-submitted != 'cleaned' }}
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_ILERT_MACHINE_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://eu.infisical.com
          secret-path: /
          secret-name: ILERT_API_KEY
      - name: Load iLert integration secret from Infisical
        if: ${{ needs.alert-stream.outputs.alert-submitted != 'cleaned' }}
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://eu.infisical.com
          secret-path: /postil
          secret-name: ILERT_INTEGRATION_KEY
      - name: Resolve and stabilize the reconstructible iLert canary
        env:
          POSTIL_ILERT_ALERT_SOURCE_ID: ${{ vars.POSTIL_ILERT_ALERT_SOURCE_ID }}
          POSTIL_ILERT_CANARY_ALERT_SUBMITTED: ${{ needs.alert-stream.outputs.alert-submitted }}
          POSTIL_ILERT_CANARY_RUN_ATTEMPT: ${{ needs.alert-stream.outputs.producer-attempt || github.run_attempt }}
          POSTIL_ILERT_CANARY_SWEEP_ATTEMPT: ${{ github.run_attempt }}
          POSTIL_ILERT_CANARY_RUN_ID: ${{ github.run_id }}
          POSTIL_ILERT_CANARY_STARTED_AT: ${{ needs.alert-stream.outputs.started-at }}
        run: timeout 12m bun run scripts/reconcile-ilert-alert-stream.ts --finalize-canary

  # Alert delivery is owned by the external alerting service (ilert). The
  # platform and this workflow only report events; paging, escalation, and
  # deduplication happen there. A stable alertKey groups consecutive failing
  # runs into one alert, and the resolve job auto-closes it on recovery.
  notify:
    name: Raise external alert
    needs: [smoke, release-recovery]
    if: ${{ always() && (needs.smoke.result == 'failure' || needs.release-recovery.result == 'failure' || needs.release-recovery.result == 'cancelled') }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Load iLert integration secret from Infisical
        id: load-alerting-secret
        continue-on-error: true
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://eu.infisical.com
          secret-path: /postil
          secret-name: ILERT_INTEGRATION_KEY
      - name: Warn when routine alert delivery is unavailable
        if: ${{ steps.load-alerting-secret.outcome == 'failure' }}
        run: echo "::warning::The optional iLert integration key could not be loaded; the event action applies its configured missing-key policy."
      - name: Send ilert event
        uses: ./.github/actions/ilert-event
        with:
          event-type: ALERT
          summary: ${{ (needs.release-recovery.result == 'failure' || needs.release-recovery.result == 'cancelled') && 'Postil release recovery failed' || 'Postil production monitor failed' }}
          alert-key: ${{ (needs.release-recovery.result == 'failure' || needs.release-recovery.result == 'cancelled') && 'postil-release-recovery' || 'postil-production-monitor' }}
          details: >-
            ${{ (needs.release-recovery.result == 'failure' || needs.release-recovery.result == 'cancelled')
                && 'Release preparation remains unresolved. Run log:'
                || 'Production checks failed. Run log:' }}
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          # A routine monitor failure records an alerting gap without masking
          # the original signal. Recovery failure requires delivery because it
          # validates the fail-safe notification path.
          require-delivery: ${{ needs.release-recovery.result == 'failure' || needs.release-recovery.result == 'cancelled' }}

  resolve-release-recovery:
    name: Resolve release recovery alert
    needs: release-recovery
    if: ${{ always() && (needs.release-recovery.outputs.clear == 'true' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')) }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify release state is active and clear
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun scripts/run-release-migrations.ts --verify-clear
      - name: Load iLert integration secret from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://eu.infisical.com
          secret-path: /postil
          secret-name: ILERT_INTEGRATION_KEY
      - name: Resolve ilert release recovery alert
        uses: ./.github/actions/ilert-event
        with:
          event-type: RESOLVE
          summary: Postil release recovery cleared
          alert-key: postil-release-recovery

  # The alert-stream job resolves its attempt-specific canary before it succeeds. This
  # resolver owns only the stable production-monitor alert key, so a manual
  # canary must not close a production incident. Every successful non-canary
  # monitor run resolves that key, including one after a manual canary.
  resolve:
    name: Resolve external alert
    needs: smoke
    if: ${{ needs.smoke.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.reconcile_alert_stream != true) }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Load iLert integration secret from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://eu.infisical.com
          secret-path: /postil
          secret-name: ILERT_INTEGRATION_KEY
      - name: Resolve ilert alert
        uses: ./.github/actions/ilert-event
        with:
          event-type: RESOLVE
          summary: Postil production monitor recovered
          alert-key: postil-production-monitor
          require-delivery: true
