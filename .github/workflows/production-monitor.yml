name: Production monitor

on:
  workflow_run:
    workflows: ["deploy"]
    types: [completed]
  schedule:
    # Requested every 15 minutes; GitHub throttles scheduled workflows, so
    # observed cadence is best-effort (often hourly or worse). This workflow
    # is the deep-check safety net that runs outside the platform's failure
    # domain; minute-level liveness paging comes from the external alerting
    # service's uptime checks and the private monitor's heartbeat.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test alert after the production checks pass
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  release-recovery:
    name: Recover abandoned release preparation
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install checksum-pinned flyctl
        env:
          FLYCTL_VERSION: 0.4.71
          FLYCTL_LINUX_X86_64_SHA256: a782dceed173d215c000ab94e2b08623c22267edff6d90ebe3010b3f9b671dc2
        run: |
          set -euo pipefail
          archive="flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          url="https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/${archive}"
          temporary_directory="$(mktemp -d)"
          trap 'rm -rf "${temporary_directory}"' EXIT
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --output "${temporary_directory}/${archive}" "${url}"
          printf '%s  %s\n' "${FLYCTL_LINUX_X86_64_SHA256}" "${temporary_directory}/${archive}" \
            | sha256sum --check --strict
          tar -xzf "${temporary_directory}/${archive}" -C "${temporary_directory}" flyctl
          install -m 0755 "${temporary_directory}/flyctl" "${RUNNER_TEMP}/flyctl"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Restore only an unchanged prior fleet
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTIL_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          machines=$(flyctl machine list --app postil-web --json)
          managed_count=$(jq -r '[.[] | select(
            .config.metadata.fly_process_group == "web" or
            .config.metadata.fly_process_group == "worker" or
            .config.metadata.fly_process_group == "monitor"
          )] | length' <<<"${machines}")
          started_count=$(jq -r '[.[] | select(
            .state == "started" and
            (.config.metadata.fly_process_group == "web" or
             .config.metadata.fly_process_group == "worker" or
             .config.metadata.fly_process_group == "monitor")
          )] | length' <<<"${machines}")
          if [[ "${managed_count}" -lt 4 || "${started_count}" -ne "${managed_count}" ]]; then
            echo "Managed fleet state is incomplete; release capabilities remain dark."
            exit 1
          fi
          while IFS= read -r id; do
            release=$(flyctl machine exec "${id}" \
              "bun -e 'process.stdout.write(process.env.POSTIL_RELEASE_SHA ?? \"\")'" \
              --app postil-web --timeout 15 2>/dev/null)
            if [[ ! "${release}" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "A managed machine did not report a valid release; capabilities remain dark."
              exit 1
            fi
            if [[ "${release}" == "${POSTIL_RELEASE_SHA}" ]]; then
              echo "The target release reached the managed fleet; capabilities remain dark."
              exit 1
            fi
          done < <(jq -r '.[] | select(
            .state == "started" and
            (.config.metadata.fly_process_group == "web" or
             .config.metadata.fly_process_group == "worker" or
             .config.metadata.fly_process_group == "monitor")
          ) | .id' <<<"${machines}")
          bun scripts/run-release-migrations.ts --compensate

  smoke:
    name: Smoke check production
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check public endpoints
        shell: bash
        env:
          METRICS_API_KEY: ${{ secrets.METRICS_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .cache
          trap 'rm -f .cache/curl-metrics.conf .cache/dependencies.out .cache/metrics.out .cache/monitor-health.out .cache/monitor-health-headers.out .cache/headers.out .cache/robots.out' EXIT

          public_endpoints=(
            "site https://postil.dev/"
            "liveness https://postil.dev/api/health"
            "sitemap https://postil.dev/sitemap.xml"
            "favicon https://postil.dev/favicon.ico"
          )

          for endpoint in "${public_endpoints[@]}"; do
            name="${endpoint%% *}"
            url="${endpoint#* }"
            echo "Checking ${name}: ${url}"
            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --output /dev/null \
              "${url}"
          done

          monitor_health_failed=0
          monitor_health_status="$(curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --dump-header .cache/monitor-health-headers.out \
            --output .cache/monitor-health.out \
            --write-out '%{http_code}' \
            "https://postil.dev/api/health/monitor")" || monitor_health_failed=1
          echo "Monitor health HTTP status: ${monitor_health_status:-unavailable}"
          if [[ "${monitor_health_failed}" -eq 1 || "${monitor_health_status}" != 2* ]]; then
            echo "Monitor health endpoint reported an unhealthy state"
            if [[ -s .cache/monitor-health.out ]]; then
              cat .cache/monitor-health.out
            else
              echo "Monitor health response body is unavailable"
            fi
            monitor_health_failed=1
          fi

          echo "Checking robots: https://postil.dev/robots.txt"
          curl \
            --fail \
            --silent \
            --show-error \
            --header "Cache-Control: no-cache" \
            --connect-timeout 5 \
            --max-time 15 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --output .cache/robots.out \
            "https://postil.dev/robots.txt"
          if grep -E '^Disallow:' .cache/robots.out; then
            echo "robots.txt should not block crawlable noindex surfaces."
            cat .cache/robots.out
            exit 1
          fi
          grep -Fx "User-Agent: *" .cache/robots.out
          grep -Fx "Allow: /" .cache/robots.out
          grep -Fx "Sitemap: https://postil.dev/sitemap.xml" .cache/robots.out

          echo "Checking canonical redirects"
          about_redirect="$(curl \
            --silent \
            --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --output /dev/null \
            --write-out '%{http_code} %{redirect_url}' \
            "https://postil.dev/about")"
          if [[ "${about_redirect}" != "308 https://postil.dev/why-postil" ]]; then
            echo "Unexpected /about redirect: ${about_redirect}"
            exit 1
          fi

          www_redirect="$(curl \
            --silent \
            --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --output /dev/null \
            --write-out '%{http_code} %{redirect_url}' \
            "https://www.postil.dev/docs?utm_source=monitor")"
          if [[ "${www_redirect}" != "308 https://postil.dev/docs?utm_source=monitor" ]]; then
            echo "Unexpected www redirect: ${www_redirect}"
            exit 1
          fi

          for endpoint in \
            "login https://postil.dev/login" \
            "api-health https://postil.dev/api/health"; do
            name="${endpoint%% *}"
            url="${endpoint#* }"
            echo "Checking noindex header for ${name}: ${url}"
            curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --dump-header .cache/headers.out \
              --output /dev/null \
              "${url}"
            if ! grep -iq '^x-robots-tag: noindex, nofollow' .cache/headers.out; then
              echo "Missing X-Robots-Tag on ${url}"
              cat .cache/headers.out
              exit 1
            fi
          done

          echo "Checking noindex header for monitor health"
          if ! grep -iq '^x-robots-tag: noindex, nofollow' .cache/monitor-health-headers.out; then
            echo "Missing X-Robots-Tag on monitor health endpoint"
            if [[ -s .cache/monitor-health-headers.out ]]; then
              cat .cache/monitor-health-headers.out
            else
              echo "Monitor health response headers are unavailable"
            fi
            monitor_health_failed=1
          fi

          echo "Checking dependencies: https://postil.dev/api/health/dependencies"
          dependency_status="$(curl \
            --location \
            --silent \
            --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --output .cache/dependencies.out \
            --write-out '%{http_code}' \
            "https://postil.dev/api/health/dependencies")"
          if [[ "${dependency_status}" != 2* ]]; then
            echo "Dependency check failed with HTTP ${dependency_status}"
            cat .cache/dependencies.out
            exit 1
          fi

          if [[ -z "${METRICS_API_KEY:-}" ]]; then
            echo "METRICS_API_KEY is required; operational incident monitoring cannot run without it"
            exit 1
          fi
          if [[ -n "${METRICS_API_KEY:-}" ]]; then
            printf 'header = "Authorization: Bearer %s"\n' "${METRICS_API_KEY}" > .cache/curl-metrics.conf
            chmod 0600 .cache/curl-metrics.conf
            echo "Checking metrics: https://postil.dev/api/metrics"
            metrics_status="$(curl \
              --location \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --config .cache/curl-metrics.conf \
              --output .cache/metrics.out \
              --write-out '%{http_code}' \
              "https://postil.dev/api/metrics")"
            if [[ "${metrics_status}" != 2* ]]; then
              echo "Metrics check failed with HTTP ${metrics_status}"
              cat .cache/metrics.out
              exit 1
            fi
            if ! grep -E '^postil_database_up 1$' .cache/metrics.out; then
              echo "Metrics check did not report postil_database_up 1"
              cat .cache/metrics.out
              exit 1
            fi
            stale_found="${monitor_health_failed}"
            if ! grep -E '^postil_private_monitor_heartbeat_fresh 1$' .cache/metrics.out; then
              echo "Private monitor heartbeat is missing or stale"
              stale_found=1
            fi
            if ! grep -E '^postil_private_monitor_collection_fresh 1$' .cache/metrics.out; then
              echo "Private monitor collection is missing or stale"
              stale_found=1
            fi
            if ! grep -E '^postil_monitor_heartbeat_delivery_fresh 1$' .cache/metrics.out; then
              echo "External monitor heartbeat delivery is missing or stale"
              stale_found=1
            fi

            # A running review or queued/running job past 30 minutes should
            # have completed or been swept by the ten-minute watchdog. This
            # checks both ledgers because a dead worker can leave a review
            # running after its queue job has already reached a terminal state.
            stale_threshold_seconds=1800
            monitor_failures=$(awk \
              '$1 == "postil_private_monitor_consecutive_failed_passes" { print $2 }' \
              .cache/metrics.out)
            echo "Consecutive failed monitor passes: ${monitor_failures:-missing}"
            if [[ -z "${monitor_failures:-}" ]] || \
               (( $(printf '%.0f' "${monitor_failures:-0}") > 1 )); then
              echo "Private monitor has more than one consecutive failed pass or its metric is missing"
              stale_found=1
            fi
            monitor_running_age=$(awk \
              '$1 == "postil_private_monitor_running_pass_age_seconds" { print $2 }' \
              .cache/metrics.out)
            echo "Running monitor pass age: ${monitor_running_age:-missing}s"
            if [[ -z "${monitor_running_age:-}" ]] || \
               (( $(printf '%.0f' "${monitor_running_age:-0}") > 900 )); then
              echo "Private monitor pass is stuck or its metric is missing"
              stale_found=1
            fi
            review_age=$(grep -E '^postil_oldest_running_review_age_seconds ' .cache/metrics.out \
              | awk '{print $2}')
            echo "Oldest running review age: ${review_age:-missing}s"
            if [[ -z "${review_age:-}" ]]; then
              echo "Running-review age metric is missing"
              stale_found=1
            elif (( $(printf '%.0f' "${review_age}") > stale_threshold_seconds )); then
              echo "Oldest running review is ${review_age}s old (over ${stale_threshold_seconds}s) - watchdog may be stuck or stopped"
              stale_found=1
            fi
            cleanup_failures=$(awk \
              '$1 == "postil_check_run_cleanup_failures_30m" { print $2 }' \
              .cache/metrics.out)
            echo "Recent failed check-run cleanup jobs: ${cleanup_failures:-missing}"
            if [[ -z "${cleanup_failures:-}" ]] || \
               (( $(printf '%.0f' "${cleanup_failures:-0}") > 0 )); then
              echo "Recent check-run cleanup reached terminal failure or its metric is missing"
              stale_found=1
            fi
            operator_alert_failures=$(awk \
              '$1 == "postil_operator_alert_failures_current" { print $2 }' \
              .cache/metrics.out)
            echo "Unresolved operator email failures: ${operator_alert_failures:-missing}"
            if [[ -z "${operator_alert_failures:-}" ]] || \
               (( $(printf '%.0f' "${operator_alert_failures:-0}") > 0 )); then
              echo "Operator email delivery failed or its metric is missing"
              stale_found=1
            fi
            operator_alert_age=$(awk \
              '$1 == "postil_oldest_operator_alert_pending_age_seconds" { print $2 }' \
              .cache/metrics.out)
            echo "Oldest pending operator email age: ${operator_alert_age:-missing}s"
            if [[ -z "${operator_alert_age:-}" ]] || \
               (( $(printf '%.0f' "${operator_alert_age:-0}") > stale_threshold_seconds )); then
              echo "Operator email delivery is stale or its metric is missing"
              stale_found=1
            fi
            billing_failures=$(awk \
              '$1 == "postil_billing_settlement_failures_current" { print $2 }' \
              .cache/metrics.out)
            echo "Billing settlements requiring attention: ${billing_failures:-missing}"
            if [[ -z "${billing_failures:-}" ]] || \
               (( $(printf '%.0f' "${billing_failures:-0}") > 0 )); then
              echo "A billing settlement failed or its metric is missing"
              stale_found=1
            fi
            billing_age=$(awk \
              '$1 == "postil_oldest_billing_settlement_pending_age_seconds" { print $2 }' \
              .cache/metrics.out)
            echo "Oldest incomplete billing settlement age: ${billing_age:-missing}s"
            if [[ -z "${billing_age:-}" ]] || \
               (( $(printf '%.0f' "${billing_age:-0}") > 3600 )); then
              echo "Billing settlement reconciliation is stale or its metric is missing"
              stale_found=1
            fi
            unmatched_billing_events=$(awk \
              '$1 == "postil_unmatched_billing_provider_events_24h" { print $2 }' \
              .cache/metrics.out)
            echo "Unmatched billing events: ${unmatched_billing_events:-missing}"
            if [[ -z "${unmatched_billing_events:-}" ]] || \
               (( $(printf '%.0f' "${unmatched_billing_events:-0}") > 0 )); then
              echo "A verified billing event could not be mapped or its metric is missing"
              stale_found=1
            fi
            billing_checkout_age=$(awk \
              '$1 == "postil_oldest_billing_checkout_open_age_seconds" { print $2 }' \
              .cache/metrics.out)
            echo "Oldest incomplete billing checkout age: ${billing_checkout_age:-missing}s"
            if [[ -z "${billing_checkout_age:-}" ]] || \
               (( $(printf '%.0f' "${billing_checkout_age:-0}") > 3600 )); then
              echo "A self-service checkout is stale or its metric is missing"
              stale_found=1
            fi
            billing_checkout_failures=$(awk \
              '$1 == "postil_billing_checkout_failures_24h" { print $2 }' \
              .cache/metrics.out)
            echo "Failed billing checkouts: ${billing_checkout_failures:-missing}"
            if [[ -z "${billing_checkout_failures:-}" ]] || \
               (( $(printf '%.0f' "${billing_checkout_failures:-0}") > 0 )); then
              echo "A self-service checkout failed or its metric is missing"
              stale_found=1
            fi
            # Hard platform failures page at zero tolerance. Model-quality
            # incidents (a review retried after bad model output, a scorer or
            # model fallback) are self-healing and only page when they burst,
            # otherwise a single flaky upstream completion pages the operator.
            incident_found=0
            for category in operational_failure scorer_failure scorer_fallback model_fallback invalid_output failed_job; do
              count=$(awk -v metric="postil_review_incidents_30m{category=\"${category}\"}" \
                '$1 == metric { print $2 }' .cache/metrics.out)
              threshold=0
              case "${category}" in
                scorer_failure) threshold=2 ;;
                scorer_fallback) threshold=2 ;;
                model_fallback) threshold=5 ;;
                invalid_output) threshold=2 ;;
              esac
              echo "Recent ${category} incidents: ${count:-missing}"
              if [[ -z "${count:-}" ]]; then
                echo "Operational incident metric is missing for ${category}"
                incident_found=1
              elif (( $(printf '%.0f' "${count}") > threshold )); then
                echo "Postil reported ${count} ${category} incident(s) in the last 30 minutes (threshold ${threshold})"
                incident_found=1
              fi
            done
            for status in queued running; do
              age=$(grep -E "^postil_oldest_job_age_seconds\{status=\"${status}\"\}" .cache/metrics.out \
                | awk '{print $2}')
              echo "Oldest ${status} job age: ${age:-missing}s"
              if [[ -n "${age:-}" ]] && (( $(printf '%.0f' "${age}") > stale_threshold_seconds )); then
                echo "Oldest ${status} job is ${age}s old (over ${stale_threshold_seconds}s) - worker may be stuck or stopped"
                stale_found=1
              fi
            done
            if [[ "${stale_found}" -eq 1 || "${incident_found}" -eq 1 ]]; then
              echo "Full metrics for context:"
              cat .cache/metrics.out
              exit 1
            fi
          fi

  # Alert delivery is owned by the external alerting service (ilert). The
  # platform and this workflow only report events; paging, escalation, and
  # deduplication happen there. A stable alertKey groups consecutive failing
  # runs into one alert, and the resolve job auto-closes it on recovery.
  notify:
    name: Raise external alert
    needs: smoke
    if: ${{ always() && (needs.smoke.result == 'failure' || inputs.test_alert == true) }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Load alerting secret from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://eu.infisical.com
          secret-path: /postil
      - name: Send ilert event
        uses: ./.github/actions/ilert-event
        with:
          event-type: ALERT
          summary: ${{ needs.smoke.result == 'failure' && 'Postil production monitor failed' || 'Postil production monitor test alert' }}
          alert-key: ${{ needs.smoke.result == 'failure' && 'postil-production-monitor' || 'postil-production-monitor-test' }}
          details: >-
            ${{ needs.smoke.result == 'failure'
                && 'Production checks failed. Run log:'
                || 'Operator-requested test alert; production checks passed. Run log:' }}
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          # A production failure pages if it can and records the gap if it
          # cannot, because the failing check is already the signal. A test
          # alert exists only to prove delivery works, so an undelivered one is
          # the failure it was run to detect.
          require-delivery: ${{ inputs.test_alert == true }}

  resolve:
    name: Resolve external alert
    needs: smoke
    if: ${{ needs.smoke.result == 'success' && inputs.test_alert != true }}
    permissions:
      contents: read
      id-token: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check whether the previous run failed
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/production-monitor.yml/runs?status=completed&per_page=5" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})][0].conclusion // \"none\"")"
          echo "conclusion=${previous}" >> "$GITHUB_OUTPUT"
          echo "Previous completed run conclusion: ${previous}"
      - name: Load alerting secret from Infisical
        if: ${{ steps.previous.outputs.conclusion == 'failure' }}
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: https://eu.infisical.com
          secret-path: /postil
      - name: Resolve ilert alert
        if: ${{ steps.previous.outputs.conclusion == 'failure' }}
        uses: ./.github/actions/ilert-event
        with:
          event-type: RESOLVE
          summary: Postil production monitor recovered
          alert-key: postil-production-monitor
