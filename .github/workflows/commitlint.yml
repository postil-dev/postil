name: Commitlint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-pr:
    name: Lint PR title and body
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const title = context.payload.pull_request.title;

            const ccRegex = /^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\(.+\))?: .+$/;
            if (!ccRegex.test(title)) {
              core.setFailed(`PR title does not follow Conventional Commits: "${title}"`);
              return;
            }

            console.log('PR title follows Conventional Commits.');
