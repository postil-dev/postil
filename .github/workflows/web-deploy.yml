name: Web Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/app/**"
      - "src/auth/**"
      - "src/components/**"
      - "src/db/**"
      - "src/lib/**"
      - "src/middleware.ts"
      - "src/instrumentation*.ts"
      - "public/**"
      - "Dockerfile"
      - "fly.toml"
      - "next.config.*"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy web app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_APP_NAME: ${{ secrets.DEPLOY_APP_NAME }}
      SECRET_PROVIDER_IDENTITY: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
      SECRET_PROVIDER_PROJECT: ${{ secrets.INFISICAL_PROJECT_SLUG }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Fetch deployment environment
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ env.SECRET_PROVIDER_IDENTITY }}
          domain: https://eu.infisical.com
          project-slug: ${{ env.SECRET_PROVIDER_PROJECT }}
          env-slug: prod
          secret-path: /postil
          export-type: env

      - name: Install flyctl CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy web app
        env:
          REPOSITORY_TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          REPOSITORY_TRIGGER_PAT: ${{ secrets.TRIGGER_PAT }}
          REPOSITORY_TRIGGER_API_TOKEN: ${{ secrets.TRIGGER_API_TOKEN }}
          REPOSITORY_TRIGGER_API_KEY: ${{ secrets.TRIGGER_API_KEY }}
          REPOSITORY_TRIGGER_SECRET_KEY: ${{ secrets.TRIGGER_SECRET_KEY }}
          REPOSITORY_TRIGGER_PROJECT_ID: ${{ secrets.TRIGGER_PROJECT_ID }}
          REPOSITORY_REVIEW_TOKEN_SECRET: ${{ secrets.REVIEW_TOKEN_SECRET }}
        run: |
          set -euo pipefail

          command -v flyctl >/dev/null || {
            echo "::error title=Missing deploy CLI::Install flyctl before deploying the web app."
            exit 1
          }
          flyctl version

          if [ -z "${DEPLOY_APP_NAME:-}" ]; then
            echo "::error title=Missing deploy target::Set DEPLOY_APP_NAME for the production environment."
            exit 1
          fi
          if [ -z "${FLY_TOKEN:-}" ]; then
            echo "::error title=Missing deploy token::Configure FLY_TOKEN in the production secret provider."
            exit 1
          fi
          export FLY_API_TOKEN="$FLY_TOKEN"
          if ! flyctl secrets list --app "$DEPLOY_APP_NAME" | awk '{print $1}' | grep -qx "BETTER_AUTH_SECRET"; then
            echo "::error title=Missing auth secret::Configure BETTER_AUTH_SECRET on the Fly app before deploying."
            exit 1
          fi

          trigger_project_id="${TRIGGER_PROJECT_ID:-${REPOSITORY_TRIGGER_PROJECT_ID:-}}"
          if [ -z "${trigger_project_id:-}" ]; then
            echo "::error title=Missing Trigger project::Configure TRIGGER_PROJECT_ID in the production secret provider or repository secrets."
            exit 1
          fi

          trigger_dispatch_secret=""
          trigger_dispatch_secret_source=""
          trigger_dispatch_invalid_sources=""
          trigger_cli_token="${TRIGGER_ACCESS_TOKEN:-${TRIGGER_PAT:-${REPOSITORY_TRIGGER_ACCESS_TOKEN:-${REPOSITORY_TRIGGER_PAT:-}}}}"

          if [ -n "${trigger_cli_token:-}" ]; then
            trigger_api_url="${TRIGGER_API_URL:-https://api.trigger.dev}"
            prod_env_body="$(curl -fsS \
              -H "Authorization: Bearer ${trigger_cli_token}" \
              -H "Content-Type: application/json" \
              "${trigger_api_url}/api/v1/projects/${trigger_project_id}/prod")"
            trigger_dispatch_secret="$(jq -r '.apiKey // empty' <<<"$prod_env_body")"
            trigger_env_api_url="$(jq -r '.apiUrl // empty' <<<"$prod_env_body")"

            if [ -z "${trigger_dispatch_secret:-}" ]; then
              echo "::error title=Trigger key lookup failed::Trigger prod environment response did not include an API key."
              exit 1
            fi
            echo "::add-mask::${trigger_dispatch_secret}"
            case "$trigger_dispatch_secret" in
              tr_prod_*)
                trigger_dispatch_secret_source="Trigger prod environment lookup"
                ;;
              *)
                echo "::error title=Wrong Trigger key::Trigger prod environment API key did not match tr_prod_ shape."
                exit 1
                ;;
            esac

            curl -fsS \
              -H "Authorization: Bearer ${trigger_dispatch_secret}" \
              "${trigger_env_api_url:-$trigger_api_url}/api/v1/projects/${trigger_project_id}/envvars/prod" \
              1>/dev/null
          fi

          choose_trigger_dispatch_secret() {
            candidate_source="$1"
            candidate_value="${2:-}"
            if [ -z "${candidate_value:-}" ]; then
              return 0
            fi
            case "$candidate_value" in
              tr_prod_*|tr_stg_*|tr_dev_*)
                if [ -z "${trigger_dispatch_secret:-}" ]; then
                  trigger_dispatch_secret="$candidate_value"
                  trigger_dispatch_secret_source="$candidate_source"
                fi
                ;;
              tr_pat_*)
                trigger_dispatch_invalid_sources="${trigger_dispatch_invalid_sources}${candidate_source}:PAT "
                ;;
              *)
                trigger_dispatch_invalid_sources="${trigger_dispatch_invalid_sources}${candidate_source}:shape "
                ;;
            esac
          }

          choose_trigger_dispatch_secret "TRIGGER_API_TOKEN" "${TRIGGER_API_TOKEN:-}"
          choose_trigger_dispatch_secret "TRIGGER_API_KEY" "${TRIGGER_API_KEY:-}"
          choose_trigger_dispatch_secret "TRIGGER_SECRET_KEY" "${TRIGGER_SECRET_KEY:-}"
          choose_trigger_dispatch_secret "repository TRIGGER_API_TOKEN" "${REPOSITORY_TRIGGER_API_TOKEN:-}"
          choose_trigger_dispatch_secret "repository TRIGGER_API_KEY" "${REPOSITORY_TRIGGER_API_KEY:-}"
          choose_trigger_dispatch_secret "repository TRIGGER_SECRET_KEY" "${REPOSITORY_TRIGGER_SECRET_KEY:-}"

          if [ -z "${trigger_dispatch_secret:-}" ]; then
            if [ -n "${trigger_dispatch_invalid_sources:-}" ]; then
              echo "::error title=Wrong Trigger secret::No configured Trigger dispatch credential matched tr_prod_, tr_stg_, or tr_dev_. Invalid sources: ${trigger_dispatch_invalid_sources}"
            else
              echo "::error title=Missing Trigger dispatch secret::Configure TRIGGER_API_TOKEN or TRIGGER_SECRET_KEY for hosted dispatch."
            fi
            exit 1
          fi
          echo "Using Trigger dispatch credential from ${trigger_dispatch_secret_source}."

          review_token_secret="${REVIEW_TOKEN_SECRET:-${REPOSITORY_REVIEW_TOKEN_SECRET:-}}"
          if [ -z "${review_token_secret:-}" ]; then
            echo "::error title=Missing review token secret::Configure REVIEW_TOKEN_SECRET in the production secret provider or repository secrets."
            exit 1
          fi

          flyctl secrets set --app "$DEPLOY_APP_NAME" --detach \
            TRIGGER_SECRET_KEY="$trigger_dispatch_secret" \
            TRIGGER_PROJECT_ID="$trigger_project_id" \
            REVIEW_TOKEN_SECRET="$review_token_secret" \
            1>/dev/null

          flyctl deploy \
            --app "$DEPLOY_APP_NAME" \
            --remote-only

      - name: Verify deployed health
        run: |
          set -euo pipefail

          health_url="${APP_URL:-https://postil.dev}/api/health"
          for attempt in $(seq 1 30); do
            body="$(curl -fsSL "$health_url" || true)"
            if [ -n "$body" ] &&
              jq -e '.ok == true and .service == "postil"' <<<"$body" >/dev/null; then
              exit 0
            fi
            sleep 10
          done

          echo "::error title=Deploy verification failed::The health endpoint did not become healthy."
          curl -fsSL "$health_url" || true
          exit 1
