name: Web Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/app/**"
      - "src/auth/**"
      - "src/components/**"
      - "src/db/**"
      - "src/lib/**"
      - "src/middleware.ts"
      - "src/instrumentation*.ts"
      - "public/**"
      - "Dockerfile"
      - "fly.toml"
      - "next.config.*"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy postil-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_APP_NAME: ${{ secrets.DEPLOY_APP_NAME }}
      SECRET_PROVIDER_IDENTITY: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
      SECRET_PROVIDER_PROJECT: ${{ secrets.INFISICAL_PROJECT_SLUG }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fetch deployment environment
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ env.SECRET_PROVIDER_IDENTITY }}
          domain: https://eu.infisical.com
          project-slug: ${{ env.SECRET_PROVIDER_PROJECT }}
          env-slug: prod
          secret-path: /postil
          export-type: env

      - name: Install flyctl CLI
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Deploy web app
        run: |
          set -euo pipefail

          command -v flyctl >/dev/null || {
            echo "::error title=Missing deploy CLI::Install flyctl before deploying postil-web."
            exit 1
          }
          flyctl version

          if [ -z "${DEPLOY_APP_NAME:-}" ]; then
            echo "::error title=Missing deploy target::Set DEPLOY_APP_NAME for the production environment."
            exit 1
          fi
          if [ -z "${FLY_TOKEN:-}" ]; then
            echo "::error title=Missing deploy token::Configure FLY_TOKEN in the production secret provider."
            exit 1
          fi
          export FLY_API_TOKEN="$FLY_TOKEN"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          flyctl deploy \
            --app "$DEPLOY_APP_NAME" \
            --remote-only \
            --build-arg "POSTIL_COMMIT_SHA=$GITHUB_SHA" \
            --build-arg "POSTIL_BUILD_TIME=$build_time"

      - name: Verify deployed health
        run: |
          set -euo pipefail

          health_url="${APP_URL:-https://postil.dev}/api/health"
          for attempt in $(seq 1 30); do
            body="$(curl -fsSL "$health_url" || true)"
            if [ -n "$body" ] &&
              jq -e --arg sha "$GITHUB_SHA" '.ok == true and .service == "postil-web" and .commit == $sha' <<<"$body" >/dev/null; then
              exit 0
            fi
            sleep 10
          done

          echo "::error title=Deploy verification failed::The health endpoint did not report the deployed commit."
          curl -fsSL "$health_url" || true
          exit 1
