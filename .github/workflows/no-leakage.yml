name: Enforce No Leakage Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  check-leakage:
    name: Check for Leakage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Subject and Diff
        id: check_leakage
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e

          # Patterns to check for leakage
          PATTERNS=(
            "paperclip"
            "noreply@paperclip\.ing"
            "Co-Authored-By: Paperclip"
            "Paperclip-Id"
            "paperclip-id"
            "Morgan\s+[A-Za-z]+"
            "Alex\s+Kim"
            "Jordan\s+Lee"
            "Casey\s+Park"
            "Riley\s+Patel"
            "Sam\s+Rivera"
            "(POSA|MOR)-\d+"
            "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
            "/home/paperclip"
            "~/\.paperclip"
            "/opt/paperclip"
            "\b[0-9a-fA-F]{40}\b"
            "GNUPGHOME"
            "proj_doapikwt"
            "4dcf4a68b32b97c5222025b15d8d4719"
            "postil-web"
            "postil-sandbox"
            "postil-lhr"
            "paperclip\.dev\.morgaes\.is"
            "morgaesis-dev"
          )
          
          # Combine patterns with OR and make case-insensitive regex
          COMBINED_PATTERN=$(IFS="|"; echo "${PATTERNS[*]}")
          
          echo "Scanning for leakage..."
          
          # We use grep -E -i (extended regex, case-insensitive)
          
          # Scan PR title
          if echo "$PR_TITLE" | grep -E -i "$COMBINED_PATTERN"; then
            echo "::error title=Leakage Detected::Found leakage in PR title"
            exit 1
          fi

          # Sanitise PR body: strip required footers mandated by commitlint so they
          # are not falsely flagged as leakage.
          SANITIZED_BODY=$(echo "$PR_BODY" | grep -v -i -E '^Co-Authored-By:\s*Paperclip' | grep -v -i -E 'paperclip-id')

          # Scan PR body
          if echo "$SANITIZED_BODY" | grep -E -i "$COMBINED_PATTERN"; then
            echo "::error title=Leakage Detected::Found leakage in PR body"
            exit 1
          fi

          # Scan branch naming
          if echo "${{ github.head_ref }}" | grep -E -i "$COMBINED_PATTERN"; then
             echo "::error title=Leakage Detected::Found leakage in branch name"
             exit 1
          fi
          
          # Scan Git Diff (excluding the leakage definition itself in workflow)
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff

          # Exclude the leakage workflow diff entirely from scanning
          awk '/^diff --git/{skip=0} /^diff --git.*no-leakage[.]yml/{skip=1} !skip' pr.diff > pr-scan.diff

          # Strip lines matching known safe patterns before scanning for leakage
          # - 'uses:' lines contain pinned SHAs (security best practice)
          # - 'tags:' and 'image:' lines contain docker image names
          # - 40-hex SHAs alone are safe unless near GPG patterns
          grep -E -v '^-' pr-scan.diff \
            | grep -E -v '^[-+ ]*uses:\s+' \
            | grep -E -v '^[-+ ]*tags:\s+' \
            | grep -E -v '^[-+ ]*image:\s+' \
            | grep -E -v '^[-+ ]*#+\s' \
            > pr-scan-filtered.diff

          # For app-name patterns, only flag when they appear as a value for
          # app-name-shaped keys (app:, FLY_APP_NAME, --app)
          SEPARATE_APP_PATTERNS=(
            "postil-web"
            "postil-sandbox"
            "postil-lhr"
          )
          for APP_PAT in "${SEPARATE_APP_PATTERNS[@]}"; do
            if grep -E -i "(^|\s)(app|FLY_APP_NAME|--app)(\s*[:=]\s*\"?)$APP_PAT" pr-scan-filtered.diff; then
              echo "::error title=Leakage Detected::Found internal app name '$APP_PAT'"
              exit 1
            fi
          done

          # For 40-hex SHA patterns, only flag if adjacent to GPG fingerprint context
          grep -E 'signingkey\s*=|gpg\s+--import' pr-scan-filtered.diff > pr-scan-gpg-context.diff || true
          if grep -E '\b[0-9a-fA-F]{40}\b' pr-scan-gpg-context.diff | grep -q .; then
            echo "::error title=Leakage Detected::Found SHA in GPG context"
            exit 1
          fi

          # Remove bare SHA patterns from the combined check (handled above)
          # and run the remaining patterns against the filtered diff
          REMAINING_PATTERNS=()
          for PAT in "${PATTERNS[@]}"; do
            case "$PAT" in
              "[0-9a-fA-F]{40}"|"postil-web"|"postil-sandbox"|"postil-lhr") ;; # skip, handled separately
              *) REMAINING_PATTERNS+=("$PAT") ;;
            esac
          done
          COMBINED_REMAINING=$(IFS="|"; echo "${REMAINING_PATTERNS[*]}")

          if grep -E -i "$COMBINED_REMAINING" pr-scan-filtered.diff; then
            echo "::error title=Leakage Detected::Found leakage in PR diff"
            echo "Matches:"
            grep -E -i "$COMBINED_REMAINING" pr-scan-filtered.diff || true
            exit 1
          fi
          
          echo "No leakage found. Passed."
