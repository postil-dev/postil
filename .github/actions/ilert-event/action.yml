name: ilert event
description: Post one event to the ilert Events API from ILERT_INTEGRATION_KEY in the environment.

inputs:
  event-type:
    description: ALERT or RESOLVE
    required: true
  summary:
    description: Event summary; becomes the alert summary for new alerts
    required: true
  alert-key:
    description: Stable key that deduplicates repeats and targets resolves
    required: true
  details:
    description: Free-text details attached to the event
    required: false
    default: ""
  priority:
    description: HIGH or LOW; ignored for RESOLVE
    required: false
    default: HIGH
  require-delivery:
    description: >-
      Fail when no integration key is configured instead of recording the
      undelivered event. Set this where the delivery itself is the subject of
      the run, such as an operator testing that paging works.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Send event
      shell: bash
      env:
        EVENT_TYPE: ${{ inputs.event-type }}
        SUMMARY: ${{ inputs.summary }}
        ALERT_KEY: ${{ inputs.alert-key }}
        DETAILS: ${{ inputs.details }}
        PRIORITY: ${{ inputs.priority }}
        REQUIRE_DELIVERY: ${{ inputs.require-delivery }}
      run: |
        set -euo pipefail
        if [[ -z "${ILERT_INTEGRATION_KEY:-}" ]]; then
          if [[ "${REQUIRE_DELIVERY}" == "true" ]]; then
            # The caller is testing delivery itself. Reporting success for an
            # event that reached nobody is the one answer that cannot be
            # allowed here: it certifies paging that does not exist.
            echo "::error title=External alerting is not configured::ILERT_INTEGRATION_KEY is unset, so this ${EVENT_TYPE} reached nobody. Set it in the alerting secret path and run this again."
            {
              echo "### Alert delivery test failed"
              echo
              echo "\`ILERT_INTEGRATION_KEY\` is unset, so ilert received nothing."
              echo "Paging is not configured; the condition this run tested is unverified."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi
          if [[ "${EVENT_TYPE}" == "RESOLVE" ]]; then
            # No alert can exist without a configured key, so there is nothing
            # to resolve, and a resolve is never the subject of a delivery
            # test; exiting nonzero here would mark the run failed and
            # re-trigger the resolve job on every following run.
            echo "ILERT_INTEGRATION_KEY is not configured; nothing to resolve"
            exit 0
          fi
          # Undelivered paging is a gap in alerting, not a second production
          # fault. Failing here adds a red job that carries no information
          # beyond the check that already failed, and it buries the alert
          # text that names the condition. Record the event where an operator
          # will find it and let the failing check remain the only signal.
          echo "::warning title=External alerting is not configured::ILERT_INTEGRATION_KEY is unset, so this ${EVENT_TYPE} was not delivered to ilert. The condition it describes still needs attention."
          {
            echo "### External alert not delivered"
            echo
            echo "\`ILERT_INTEGRATION_KEY\` is unset, so ilert received nothing for this event."
            echo "Set it in the alerting secret path to page on this condition."
            echo
            echo "- **Summary:** ${SUMMARY}"
            echo "- **Alert key:** \`${ALERT_KEY}\`"
            echo "- **Priority:** ${PRIORITY}"
            if [[ -n "${DETAILS}" ]]; then
              echo "- **Details:** ${DETAILS}"
            fi
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit 0
        fi
        jq -n \
          --arg key "${ILERT_INTEGRATION_KEY}" \
          --arg eventType "${EVENT_TYPE}" \
          --arg summary "${SUMMARY}" \
          --arg alertKey "${ALERT_KEY}" \
          --arg details "${DETAILS}" \
          --arg priority "${PRIORITY}" \
          '{integrationKey: $key, eventType: $eventType, summary: $summary, alertKey: $alertKey}
           + (if $details != "" then {details: $details} else {} end)
           + (if $eventType == "ALERT" then {priority: $priority} else {} end)' \
          > "${RUNNER_TEMP}/ilert-event.json"
        status="$(curl \
          --silent \
          --show-error \
          --connect-timeout 5 \
          --max-time 15 \
          --retry 3 \
          --retry-delay 5 \
          --retry-all-errors \
          --header 'Content-Type: application/json' \
          --data @"${RUNNER_TEMP}/ilert-event.json" \
          --output /dev/null \
          --write-out '%{http_code}' \
          https://api.ilert.com/api/events)"
        rm -f "${RUNNER_TEMP}/ilert-event.json"
        if [[ "${status}" != 2* ]]; then
          echo "ilert ${EVENT_TYPE} delivery failed with HTTP ${status}"
          exit 1
        fi
        echo "ilert ${EVENT_TYPE} accepted for ${ALERT_KEY}"
