name: 'Postil Review Gate'
description: 'Low-noise review gate for agent-speed development, merge-relevant risk, and unchecked changes.'
author: 'Postil'
branding:
  icon: 'git-pull-request'
  color: 'blue'

inputs:
  api-key:
    description: 'OpenRouter API key'
    required: true
  model:
    description: 'OpenRouter model name'
    required: false
    default: 'deepseek/deepseek-v4-pro'
  fail-on:
    description: 'Exit 1 when a finding meets this severity: info, warn, or error'
    required: false
    default: 'error'
  no-inline:
    description: 'Skip posting inline PR review comments'
    required: false
    default: 'false'
  config-path:
    description: 'Optional path to a configuration file'
    required: false
  github-token:
    description: 'GitHub token for posting review comments'
    required: false
    default: '${{ github.token }}'

runs:
  using: 'composite'
  steps:
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
    - name: Install Postil reviewer
      shell: bash
      run: |
        reviewer_rev="$(tr -d '[:space:]' < "$GITHUB_ACTION_PATH/reviewer-rev")"
        test -n "$reviewer_rev"
        cargo install --git https://github.com/postil-dev/postil-reviewer --rev "$reviewer_rev" --locked --force
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Run Postil review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENROUTER_API_KEY: ${{ inputs.api-key }}
        REVIEW_MODEL: ${{ inputs.model }}
        POSTIL_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=(review)
        if [[ -n "${{ inputs.config-path }}" ]]; then
          args+=(--config "${{ inputs.config-path }}")
        fi
        if [[ "${{ inputs.no-inline }}" == "true" ]]; then
          args+=(--no-inline)
        fi
        postil "${args[@]}"
