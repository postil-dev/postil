name: 'Postil AI Review'
description: 'AI pull-request reviewer for serious teams — open-source, zero-infra, fully auditable.'
author: 'Postil'
branding:
  icon: 'git-pull-request'
  color: 'blue'

inputs:
  api-key:
    description: 'OpenRouter API key'
    required: true
  model:
    description: 'OpenRouter model name'
    required: false
    default: 'moonshotai/kimi-k2.6'
  fail-on:
    description: 'Exit 1 when a finding meets this severity: info, warn, or error'
    required: false
    default: 'error'
  no-inline:
    description: 'Skip posting inline PR review comments'
    required: false
    default: 'false'
  config-path:
    description: 'Optional path to a configuration file'
    required: false
  github-token:
    description: 'GitHub token for posting review comments'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        toolchain: stable

    - name: Verify reviewer commit
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        reviewer_rev="$(< "$GITHUB_ACTION_PATH/reviewer-rev")"
        auth_args=()
        if [[ -n "${GITHUB_TOKEN:-}" ]]; then
          auth_args=(-H "Authorization: Bearer $GITHUB_TOKEN")
        fi
        verification="$(
          curl -fsSL \
            "${auth_args[@]}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/postil-dev/postil-reviewer/commits/$reviewer_rev"
        )"
        if [[ "$(jq -r '.sha' <<<"$verification")" != "$reviewer_rev" ]]; then
          echo "::error::reviewer commit SHA does not match reviewer-rev"
          exit 1
        fi
        if [[ "$(jq -r '.commit.verification.verified' <<<"$verification")" != "true" ]]; then
          echo "::error::reviewer commit is not verified"
          exit 1
        fi
        if [[ "$(jq -r '.commit.verification.reason' <<<"$verification")" != "valid" ]]; then
          echo "::error::reviewer commit verification reason is not valid"
          exit 1
        fi
        if [[ "$(jq -r '.author.login' <<<"$verification")" != "morgaesis" ]]; then
          echo "::error::reviewer author login does not match trusted signer"
          exit 1
        fi
        if [[ "$(jq -r '.committer.login' <<<"$verification")" != "morgaesis" ]]; then
          echo "::error::reviewer committer login does not match trusted signer"
          exit 1
        fi

    - name: Install Postil reviewer
      shell: bash
      run: |
        reviewer_rev="$(< "$GITHUB_ACTION_PATH/reviewer-rev")"
        reviewer_dir="$(mktemp -d)"
        git -C "$reviewer_dir" init -q
        git -C "$reviewer_dir" remote add origin https://github.com/postil-dev/postil-reviewer
        git -C "$reviewer_dir" fetch --depth=1 origin "$reviewer_rev"
        git -C "$reviewer_dir" checkout --force FETCH_HEAD
        if [[ "$(git -C "$reviewer_dir" rev-parse HEAD)" != "$reviewer_rev" ]]; then
          echo "::error::checked-out reviewer revision does not match reviewer-rev"
          exit 1
        fi
        cargo install --path "$reviewer_dir" --locked --force
    - name: Run Postil review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        OPENROUTER_API_KEY: ${{ inputs.api-key }}
        REVIEW_MODEL: ${{ inputs.model }}
        POSTIL_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_CONFIG_PATH: ${{ inputs.config-path }}
        INPUT_NO_INLINE: ${{ inputs.no-inline }}
      run: |
        args=(review)
        if [[ -n "${INPUT_CONFIG_PATH:-}" ]]; then
          args+=(--config "$INPUT_CONFIG_PATH")
        fi
        if [[ "${INPUT_NO_INLINE:-}" == "true" ]]; then
          args+=(--no-inline)
        fi
        postil "${args[@]}"
