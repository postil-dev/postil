name: 'Postil AI Review'
description: 'AI pull-request reviewer for serious teams — open-source, zero-infra, fully auditable.'
author: 'Postil'
branding:
  icon: 'git-pull-request'
  color: 'blue'

inputs:
  api-key:
    description: 'API key for the LLM provider (OpenAI or Anthropic)'
    required: true
  provider:
    description: 'LLM provider: openai or anthropic'
    required: false
    default: 'openai'
  model:
    description: 'Model name to use (e.g. gpt-4o-mini, claude-3-5-haiku-20241022)'
    required: false
  config-path:
    description: 'Optional path to a configuration file'
    required: false
  github-token:
    description: 'GitHub token for posting review comments'
    required: false
    default: '${{ github.token }}'

runs:
  using: 'node20'
  main: 'dist/action.js'
