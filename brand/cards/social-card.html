<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>postil — social card</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#0F0F12;color:#F5F4EE;font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{width:1200px;height:630px;background:#0F0F12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:64px;position:relative;overflow:hidden;border:1px solid #19191D}
  .card::before{content:'';position:absolute;inset:0;background:radial-gradient(400px 300px at 20% 80%,rgba(217,119,6,0.12),transparent),radial-gradient(300px 200px at 80% 20%,rgba(16,185,129,0.10),transparent)}
  .mark{width:72px;height:72px}
  .headline{font-size:52px;font-weight:700;letter-spacing:-0.02em;text-align:center;z-index:1}
  .headline span{color:#D97706}
  .sub{font-size:20px;color:#8B8B8E;text-align:center;max-width:640px;z-index:1}
  .url{margin-top:4px;font-family:'JetBrains Mono',Menlo,monospace;font-size:18px;color:#10B981;z-index:1}
</style>
</head>
<body>
<div class="card">
  <svg class="mark" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg"><circle cx="140" cy="140" r="90" fill="none" stroke="#D97706" stroke-width="20" stroke-linecap="round" stroke-dasharray="420 100"/><circle cx="140" cy="140" r="18" fill="#10B981"/></svg>
  <h1 class="headline">The AI reviewer <span>serious teams</span> trust.</h1>
  <p class="sub">High signal, low noise, fully auditable. Open-source under Apache 2.0.</p>
  <div class="url">postil.dev</div>
</div>
</body>
</html>
