<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>postil — homepage hero</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#0F0F12;color:#F5F4EE;font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .hero{width:1200px;height:630px;background:#0F0F12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;padding:80px 120px;position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(600px 400px at 15% 20%,rgba(217,119,6,0.15),transparent),radial-gradient(400px 300px at 85% 80%,rgba(16,185,129,0.12),transparent)}
  .mark{width:80px;height:80px}
  .headline{font-size:72px;font-weight:700;letter-spacing:-0.02em;text-align:center;z-index:1}
  .headline span{color:#D97706}
  .sub{font-size:24px;color:#8B8B8E;text-align:center;max-width:720px;z-index:1;line-height:1.4}
  .cta{margin-top:8px;font-size:18px;color:#F5F4EE;background:#D97706;border-radius:8px;padding:12px 32px;z-index:1}
</style>
</head>
<body>
<div class="hero">
  <svg class="mark" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg"><circle cx="140" cy="140" r="90" fill="none" stroke="#D97706" stroke-width="20" stroke-linecap="round" stroke-dasharray="420 100"/><circle cx="140" cy="140" r="18" fill="#10B981"/></svg>
  <h1 class="headline">Serious teams.<br><span>Serious reviews.</span></h1>
  <p class="sub">The AI pull-request reviewer engineers trust&nbsp;&mdash; high signal, low noise, fully auditable.</p>
  <div class="cta">Get started</div>
</div>
</body>
</html>
