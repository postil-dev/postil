app = "postil"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[build.args]
  POSTIL_CLI_REV = "3b22dd99e8231c5eb596c77b6689e97c66ecca1e"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  POSTIL_CLI_PATH = "/usr/local/bin/postil"
  APP_URL = "https://postil.dev"
  BETTER_AUTH_URL = "https://postil.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  protocol = "http"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[processes]
  app = "bun run start"
  worker = "bun run src/worker/run.ts"
