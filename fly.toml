# Fly.io deployment for the Postil control plane.
#
# Three process groups share one image: `web` serves the Next.js app, `worker`
# runs the job queue, and `monitor` owns private production monitoring. Set
# secrets before the first deploy:
#
#   fly secrets set DATABASE_URL=... POSTIL_SESSION_SECRET=... \
#     GITHUB_WEBHOOK_SECRET=... GITHUB_OAUTH_CLIENT_ID=... \
#     GITHUB_OAUTH_CLIENT_SECRET=... POSTIL_SEALING_KEY=... \
#     GITHUB_APP_ID=... GITHUB_APP_PRIVATE_KEY=... MODEL_API_KEY=... \
#     POSTIL_API_KEY=... METRICS_TOKEN=... POSTHOG_PROJECT_TOKEN=...
#
# Browser PostHog receives the public project token from a runtime route so
# POSTHOG_CLIENT_CAPTURE can disable initialization without rebuilding.
#
# Migrations and retired-job quiescence run automatically via
# [deploy].release_command below. Fly runs it as a one-off machine from the
# new image, with the app's env/secrets
# (including DATABASE_URL), before any existing machine is updated. A
# non-zero exit aborts the deploy, so code that depends on a migration can
# no longer ship ahead of it. `drizzle-kit` and the `drizzle/` migrations
# folder ship in the runtime image (full node_modules incl. devDependencies,
# full repo via `COPY . .` in the Dockerfile), so no image changes were
# needed. For a one-off manual run: fly ssh console -C "bun run db:migrate"

app = "postil-web"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]

[build.args]
# GitHub Actions supplies the required compatible release tag.
NEXT_PUBLIC_POSTHOG_HOST = "https://eu.i.posthog.com"

[deploy]
release_command = "bun scripts/start-managed-process.ts release"

[processes]
web = "bun scripts/start-managed-process.ts web"
worker = "bun scripts/start-managed-process.ts worker"
monitor = "bun scripts/start-managed-process.ts monitor"

[env]
NODE_ENV = "production"
POSTIL_PUBLIC_URL = "https://postil.dev"
GITHUB_APP_SLUG = "postil-dev"
POSTIL_BIN = "/usr/local/bin/postil"
POSTIL_DB_POOL_MAX = "2"
# The pinned CLI owns the managed roster. This switch permits hosted inference;
# the exact release also requires durable post-deploy activation.
POSTIL_HOSTED_INFERENCE_ENABLED = "1"
POSTIL_PROVISIONAL_HOSTED_ROSTER = "1"
POSTIL_WEBHOOK_DRAIN_ENABLED = "1"
POSTIL_QUEUE_DRAIN_MAX_JOBS = "1"
POSTIL_QUEUE_DRAIN_DEADLINE_MS = "720000"
WORKER_CONCURRENCY = "1"
WORKER_POLL_INTERVAL_MS = "1000"
WORKER_IDLE_POLL_MAX_MS = "900000"
WORKER_WATCHDOG_INTERVAL_MS = "60000"
WORKER_HEARTBEAT_INTERVAL_MS = "30000"
POSTIL_MONITOR_INTERVAL_MS = "300000"
POSTIL_MONITOR_ALERT_STATE_PATH = "/var/lib/postil-monitor/alert-state.json"
POSTHOG_CLIENT_CAPTURE = "1"
POSTHOG_ERROR_CAPTURE = "0"
POSTHOG_LOG_CAPTURE = "0"
NEXT_PUBLIC_POSTHOG_HOST = "https://eu.i.posthog.com"
POSTIL_OPERATOR_ALERT_EMAIL = "hello@postil.dev"

[[mounts]]
source = "postil_monitor_state"
destination = "/var/lib/postil-monitor"
processes = ["monitor"]
initial_size = "1gb"
snapshot_retention = 1

[http_service]
processes = ["web"]
internal_port = 3000
force_https = true
# The control plane must stay warm to receive GitHub webhooks promptly; a
# stopped machine that the proxy has to cold-start drops/retries deliveries and
# produced lease contention and machine-API rate-limit errors. Keep both web
# machines running (min = 2, no auto-stop): with min = 1 the second machine sat
# stopped and the proxy 5xx'd trying to wake it on demand during deploys, which
# an operational audit caught hitting /api/webhooks/github.
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 2

[[http_service.checks]]
interval = "15s"
timeout = "5s"
grace_period = "20s"
method = "GET"
path = "/api/health"

[[vm]]
processes = ["web"]
size = "shared-cpu-1x"
memory = "512mb"

[[vm]]
processes = ["worker"]
size = "shared-cpu-1x"
memory = "512mb"

[[vm]]
processes = ["monitor"]
size = "shared-cpu-1x"
memory = "256mb"
