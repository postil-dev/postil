# Postil self-hosted stack: Postgres, web, worker.
#
#   cp .env.example .env   # fill in the required values
#   docker compose up -d
#   docker compose exec web bun run db:migrate
#
# Both web and worker validate required configuration at boot and exit with
# an actionable message if anything is missing.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postil
      POSTGRES_PASSWORD: postil
      POSTGRES_DB: postil
    volumes:
      - postil-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postil -d postil"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      args:
        # Pinned postil-cli release the runtime image fetches and bakes in.
        # Override to a 40-hex commit or another release tag to upgrade the
        # reviewer, or drop a binary at vendor/postil to skip the fetch.
        POSTIL_CLI_REV: ${POSTIL_CLI_REV:-v0.1.1}
    env_file: .env
    environment:
      DATABASE_URL: postgres://postil:postil@db:5432/postil
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # bun is the only runtime guaranteed in the image; curl is not in oven/bun.
      test: ["CMD-SHELL", "bun -e 'const r=await fetch(\"http://localhost:3000/api/health\");if(!r.ok)process.exit(1)' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      args:
        POSTIL_CLI_REV: ${POSTIL_CLI_REV:-v0.1.1}
    command: ["bun", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postil:postil@db:5432/postil
      POSTIL_BIN: /usr/local/bin/postil
    depends_on:
      db:
        condition: service_healthy

  # Optional local model server. Not started by default; bring it up with
  #   docker compose --profile ollama up -d
  # then pull a model before the first review:
  #   docker compose exec ollama ollama pull qwen3-coder:30b
  # Set POSTIL_API_BASE=http://ollama:11434/v1 in .env so the worker can reach
  # it on the compose network. Omit the profile and run Ollama on the host
  # (POSTIL_API_BASE=http://host.docker.internal:11434/v1) if you prefer.
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    volumes:
      - postil-ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  postil-pgdata:
  postil-ollama:
