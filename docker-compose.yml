# Postil self-hosted stack: Postgres, web, worker.
#
#   cp .env.example .env   # fill in the required values
#   docker compose up -d
#   docker compose exec web bun run db:migrate
#
# Both web and worker validate required configuration at boot and exit with
# an actionable message if anything is missing.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postil
      POSTGRES_PASSWORD: postil
      POSTGRES_DB: postil
    volumes:
      - postil-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postil -d postil"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      args:
        POSTIL_CLI_REV: ${POSTIL_CLI_REV:-unpinned}
    env_file: .env
    environment:
      DATABASE_URL: postgres://postil:postil@db:5432/postil
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      args:
        POSTIL_CLI_REV: ${POSTIL_CLI_REV:-unpinned}
    command: ["bun", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postil:postil@db:5432/postil
      POSTIL_BIN: /usr/local/bin/postil
    depends_on:
      db:
        condition: service_healthy

volumes:
  postil-pgdata:
